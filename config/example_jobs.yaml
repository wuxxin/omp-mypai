jobs:
  - name: Periodic Work Sweep Audit
    description: Audit active project tasks, verify pending commitments, and reflect on progress
    cron: "*/30 * * * *"
    enabled: true
    kind: omp
    action: prompt
    kwargs:
      prompt: |
        Audit active project todos, verify pending commitments, and reflect on progress. Use 300 words.
        Dont ask for a followup. Just report.

  - name: Hindsight Reflection Sweep
    description: Trigger Hindsight memory reflection sweep across active project memory banks
    cron: "0 */2 * * *"
    enabled: true
    kind: http
    action: POST
    args:
      - "#[HINDSIGHT_API_URL]/v1/default/banks/#[HINDSIGHT_BANK_ID]/reflect"
    kwargs:
      query: Periodic health reflection sweep
      reason: scheduled_health_sync
    opts:
      timeout_sec: 300
      headers:
        Content-Type: application/json
    result:
      action: prompt
      prompt: "Hindsight Reflection Sweep for #[_JOB_NAME] completed with status #[_HTTP_CODE]. Response: #[_OUTPUT]"
      error_prompt: |
        CRON ERROR: http job '#[_JOB_NAME]' failed with http code #[_HTTP_CODE].
        job_id: #[_JOB_ID]
        action: #[_ACTION]
        args: #[_ARGS]
        kwargs: #[_KWARGS]
        opts: #[_OPTS]
        http_code: #[_HTTP_CODE]
        error:
        ```log
        #[_ERROR]
        ```
        INSTRUCTIONS: Do not fix this, but add TODO with information how to fix it for later.
          if a TODO for this job fixing is already existing, disable Job, update TODO that you disabled Job.

  - name: Nightly Database Backup & Audit
    description: Run automated database health audit and backup script
    cron: "0 3 * * *"
    enabled: true
    kind: shell
    action: python3
    args:
      - scripts/db_audit.py
      - --quick
      - #{example_env}
    opts:
      timeout_sec: 30
      env:
        # example env injection
        example_env: testing
      # example custom error lambda, eg. errorlevel 1 is ok., default error on is ERROR_LEVEL > 0
      error_on: "lambda args, kwargs: true if kwargs.get('_ERROR_LEVEL') > 2 else False"
      # example disable lambda, disable cron task depending error level, default is empty (disabled automatic disabling)
      disable_on: "lambda args, kwargs: true if kwargs.get('_ERROR_LEVEL') > 5 else False"

    result:
      action: log
      # log=the old ignore, the old default, just log, dont inject or append into turn
      prompt: |
        CRON: Nightly Database Audit completed successfully for #[_JOB_NAME].
        Output:
        ```log
        #[_OUTPUT]
        ```
        FYI only. Dont ask for a followup.
      # add error_action because we want both sometimes be different, if not set defaults to action.
      error_action: prompt
      error_prompt: |
        CRON ERROR: Shell job '#[_JOB_NAME]' failed with return code #[_RETURN_CODE].
        job_id: #[_JOB_ID]
        action: #[_ACTION]
        args: #[_ARGS]
        return_code: #[_RETURN_CODE]
        error:
        ```log
        #[_ERROR]
        ```
        INSTRUCTIONS: Do not fix this, but add TODO with information how to fix it for later.
          if a TODO for this job fixing is already existing, disable Job, update TODO that you disabled Job.

  - name: System Resource Metric Calculation
    description: Compute memory usage and system uptime stats in-process
    cron: "0 * * * *"
    enabled: true
    kind: python
    action: "lambda args, kwargs: {'status': 'healthy', 'uptime_sec': kwargs.get('uptime', 86400)}"
    args: []
    kwargs:
      uptime: 86400
    result:
      action: prompt
      prompt: "System Resource Metrics for #[_JOB_NAME]: #[_OUTPUT]"
      error_prompt: |
        CRON ERROR: python job '#[_JOB_NAME]' failed with return code #[_RETURN_CODE].
        job_id: #[_JOB_ID]
        action: #[_ACTION]
        args: #[_ARGS]
        kwargs: #[_KWARGS]
        return_code: #[_RETURN_CODE]
        error:
        ```log
        #[_ERROR]
        ```
        INSTRUCTIONS: Do not fix this, but add TODO with information how to fix it for later.
          if a TODO for this job fixing is already existing, disable Job, update TODO that you disabled Job.

