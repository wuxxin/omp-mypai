[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "mypai_tools"
version = "0.1.0"
description = "MyPAI agent tools package for oh-my-pi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0.0",
    "httpx>=0.24.0",
    "watchdog>=3.0.0",
    "pyyaml>=6.0",
    "mcp>=1.2.0,<2",
    "apscheduler>=3.10.0,<4.0.0",
    "omp-rpc>=0.1.0",
]

[tool.setuptools]
packages = ["mypai_tools", "mypai_tools.executors"]
package-dir = {"mypai_tools" = "."}
