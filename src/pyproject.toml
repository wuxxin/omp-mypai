[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mypai_tools"
version = "0.1.0"
description = "MyPAI agent tools, daemons, and MCP servers package for oh-my-pi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "websockets>=11.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.24.0",
    "watchdog>=3.0.0",
    "pyyaml>=6.0",
    "mcp>=1.2.0,<2",
    "apscheduler>=3.10.0,<4.0.0",
    "omp-rpc>=0.1.0",
]

[project.scripts]
mypai_daemon = "mypai_tools.daemon.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mypai_tools*"]

[tool.setuptools.package-data]
mypai_tools = ["webui/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
