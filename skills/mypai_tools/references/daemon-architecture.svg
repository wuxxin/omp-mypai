<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" width="840" height="540" style="max-width: 100%; height: auto;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#78716c" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b5523a" />
    </marker>
    
    <!-- Drop shadow filter for cards -->
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1c1917" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="540" rx="12" fill="#faf7f2" stroke="#e7e4df" stroke-width="1"/>

  <!-- ==================== TIER 1: INPUT EVENT SOURCES ==================== -->
  <rect x="35" y="25" width="770" height="90" rx="8" fill="rgba(245, 242, 237, 0.6)" stroke="#d6d0c4" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="50" y="44" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#78716c" letter-spacing="0.8">INPUT EVENT SOURCES</text>

  <!-- Input 1: Signal Webhook -->
  <g filter="url(#card-shadow)">
    <rect x="50" y="55" width="170" height="46" rx="6" fill="#ffffff" stroke="#d6d0c4" stroke-width="1"/>
    <text x="135" y="74" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1c1917" text-anchor="middle">Signal Webhook</text>
    <text x="135" y="90" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" fill="#78716c" text-anchor="middle">signal-cli-rest-api</text>
  </g>

  <!-- Input 2: Input Spooler -->
  <g filter="url(#card-shadow)">
    <rect x="240" y="55" width="170" height="46" rx="6" fill="#ffffff" stroke="#d6d0c4" stroke-width="1"/>
    <text x="325" y="74" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1c1917" text-anchor="middle">Input Spooler</text>
    <text x="325" y="90" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" fill="#78716c" text-anchor="middle">Inbox Watcher &amp; STT</text>
  </g>

  <!-- Input 3: cron_mcp -->
  <g filter="url(#card-shadow)">
    <rect x="430" y="55" width="170" height="46" rx="6" fill="#ffffff" stroke="#d6d0c4" stroke-width="1"/>
    <text x="515" y="74" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1c1917" text-anchor="middle">cron_mcp</text>
    <text x="515" y="90" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" fill="#78716c" text-anchor="middle">FastMCP Tool Server</text>
  </g>

  <!-- Input 4: WebUI Browser -->
  <g filter="url(#card-shadow)">
    <rect x="620" y="55" width="170" height="46" rx="6" fill="#ffffff" stroke="#d6d0c4" stroke-width="1"/>
    <text x="705" y="74" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1c1917" text-anchor="middle">WebUI Browser</text>
    <text x="705" y="90" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" fill="#78716c" text-anchor="middle">Glassmorphic SPA</text>
  </g>

  <!-- Connectors: Inputs -> FastAPI Engine -->
  <line x1="135" y1="101" x2="135" y2="155" stroke="#a8a29e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="325" y1="101" x2="325" y2="155" stroke="#a8a29e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="515" y1="101" x2="515" y2="155" stroke="#a8a29e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="705" y1="101" x2="705" y2="155" stroke="#a8a29e" stroke-width="1.2" marker-end="url(#arrow)"/>


  <!-- ==================== TIER 2: MYPAI_DAEMON CORE PROCESS ==================== -->
  <rect x="35" y="140" width="770" height="260" rx="8" fill="rgba(252, 250, 246, 0.8)" stroke="#b5523a" stroke-width="1.5"/>
  <text x="50" y="160" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#b5523a" letter-spacing="0.8">MYPAI_DAEMON CORE PROCESS (PORT 52080)</text>

  <!-- 2.1: FastAPI REST Web Server & WebSocket Engine -->
  <g filter="url(#card-shadow)">
    <rect x="50" y="170" width="740" height="44" rx="6" fill="#ffffff" stroke="#d6d0c4" stroke-width="1"/>
    <text x="420" y="189" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1c1917" text-anchor="middle">FastAPI REST Web Server &amp; WebSocket Engine</text>
    <text x="420" y="205" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" fill="#78716c" text-anchor="middle">Endpoints: /api/v1 (prompt, steer, followup, abort_and_prompt, /ws)</text>
  </g>

  <!-- Connector: FastAPI -> Priority Queue -->
  <line x1="420" y1="214" x2="420" y2="236" stroke="#b5523a" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <!-- 2.2: Prioritized Event Queue & Turn Serializer (FOCAL POINT) -->
  <g filter="url(#card-shadow)">
    <rect x="50" y="238" width="740" height="48" rx="6" fill="#fffcf7" stroke="#b5523a" stroke-width="1.8"/>
    <!-- Priority Badge -->
    <rect x="62" y="252" width="118" height="20" rx="4" fill="rgba(181, 82, 58, 0.12)"/>
    <text x="121" y="266" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#b5523a" text-anchor="middle">MPSC QUEUE &amp; LOCK</text>
    <text x="420" y="258" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#b5523a" text-anchor="middle">Prioritized Event Queue &amp; Turn Serializer</text>
    <text x="420" y="275" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" fill="#78716c" text-anchor="middle">Multi-Producer, Single-Consumer (Priority: Steer/Abort &gt; WebUI/Signal &gt; Cron/Spooler)</text>
  </g>

  <!-- Connectors: Queue -> Subservices -->
  <path d="M 175,286 V 305 H 175 V 323" stroke="#a8a29e" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 420,286 V 323" stroke="#b5523a" stroke-width="1.5" fill="none" marker-end="url(#arrow-accent)"/>
  <path d="M 665,286 V 305 H 665 V 323" stroke="#a8a29e" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

  <!-- 2.3a: APScheduler Engine -->
  <g filter="url(#card-shadow)">
    <rect x="50" y="325" width="230" height="54" rx="6" fill="#ffffff" stroke="#d6d0c4" stroke-width="1"/>
    <text x="165" y="347" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1c1917" text-anchor="middle">APScheduler Engine</text>
    <text x="165" y="364" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" fill="#78716c" text-anchor="middle">Cron Jobs (cron-&lt;hash&gt;.db)</text>
  </g>

  <!-- 2.3b: OMP RPC Session Manager (FOCAL CORE) -->
  <g filter="url(#card-shadow)">
    <rect x="300" y="325" width="240" height="54" rx="6" fill="#fffcf7" stroke="#b5523a" stroke-width="1.5"/>
    <text x="420" y="347" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#b5523a" text-anchor="middle">OMP RPC Session Manager</text>
    <text x="420" y="364" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" fill="#78716c" text-anchor="middle">Auto-Reconnect, Heartbeat &amp; RPC Client</text>
  </g>

  <!-- 2.3c: Embedded WebUI -->
  <g filter="url(#card-shadow)">
    <rect x="560" y="325" width="230" height="54" rx="6" fill="#ffffff" stroke="#d6d0c4" stroke-width="1"/>
    <text x="675" y="347" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1c1917" text-anchor="middle">Embedded WebUI</text>
    <text x="675" y="364" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" fill="#78716c" text-anchor="middle">Static Assets &amp; WebSocket Stream</text>
  </g>

  <!-- Connector: OMP Session Manager -> Target Execution Session -->
  <line x1="420" y1="379" x2="420" y2="433" stroke="#b5523a" stroke-width="2" marker-end="url(#arrow-accent)"/>


  <!-- ==================== TIER 3: TARGET WORKDIR OMP SESSION ==================== -->
  <rect x="35" y="420" width="770" height="90" rx="8" fill="rgba(245, 242, 237, 0.6)" stroke="#d6d0c4" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="50" y="440" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#78716c" letter-spacing="0.8">TARGET WORKDIR OMP SESSION EXECUTION</text>

  <!-- Terminal / OMP Execution Box -->
  <g filter="url(#card-shadow)">
    <rect x="50" y="450" width="740" height="46" rx="6" fill="#1c1917" stroke="#292524" stroke-width="1"/>
    <!-- Shell prompt symbol -->
    <text x="70" y="478" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" fill="#b5523a">$</text>
    <text x="88" y="478" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#f5f5f4">omp --mode rpc --auto-approve --continue --session &lt;MYPAI_SESSION_NAME&gt;</text>
    <!-- Status Pill -->
    <rect x="690" y="463" width="85" height="20" rx="4" fill="rgba(34, 197, 94, 0.15)"/>
    <circle cx="702" cy="473" r="3" fill="#22c55e"/>
    <text x="712" y="477" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#22c55e">ACTIVE RPC</text>
  </g>
</svg>
