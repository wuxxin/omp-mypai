<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 580" width="840" height="580" style="max-width: 100%; height: auto;">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      .text-title { font-family: 'Instrument Serif', serif; }
      .text-sans { font-family: 'Geist', -apple-system, sans-serif; }
      .text-mono { font-family: 'Geist Mono', monospace; }
    </style>
    <filter id="card-shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="accent-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#3b82f6" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Canvas Outer Background -->
  <rect width="840" height="580" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1"/>

  <!-- ==================== MAIN GLASS WINDOW CONTAINER ==================== -->
  <rect x="20" y="20" width="800" height="540" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#card-shadow)"/>

  <!-- ==================== HEADER BAR ==================== -->
  <path d="M 20 30 A 10 10 0 0 1 30 20 L 810 20 A 10 10 0 0 1 820 30 L 820 65 L 20 65 Z" fill="#1e293b"/>
  <line x1="20" y1="65" x2="820" y2="65" stroke="#334155" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="40" cy="42" r="5" fill="#ef4444"/>
  <circle cx="56" cy="42" r="5" fill="#f59e0b"/>
  <circle cx="72" cy="42" r="5" fill="#22c55e"/>

  <!-- Title & Logo -->
  <text x="96" y="46" class="text-sans" font-size="14" font-weight="700" fill="#f8fafc" letter-spacing="-0.01em">MyPAI Daemon Dashboard</text>
  <rect x="260" y="32" width="105" height="20" rx="10" fill="rgba(34, 197, 94, 0.15)" stroke="rgba(34, 197, 94, 0.3)" stroke-width="1"/>
  <circle cx="272" cy="42" r="3.5" fill="#22c55e"/>
  <text x="281" y="46" class="text-sans" font-size="10" font-weight="600" fill="#4ade80">CONNECTED</text>

  <!-- Header Right Telemetry -->
  <text x="800" y="46" class="text-mono" font-size="11" fill="#94a3b8" text-anchor="end">PID: 12345  ·  ~/mypai  ·  Uptime: 01:23:45</text>

  <!-- ==================== MAIN COLUMN (LEFT) ==================== -->
  <g filter="url(#card-shadow)">
    <!-- Container -->
    <rect x="35" y="80" width="480" height="465" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Sub-header -->
    <rect x="35" y="80" width="480" height="28" rx="8" fill="#0f172a"/>
    <path d="M 35 108 L 515 108" stroke="#1e293b" stroke-width="1"/>
    <text x="48" y="98" class="text-sans" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.5">LIVE SESSION TRANSCRIPT &amp; EVENT STREAM</text>
    
    <!-- Auto-scroll pill -->
    <rect x="420" y="86" width="85" height="16" rx="4" fill="rgba(14, 165, 233, 0.15)"/>
    <text x="462" y="97" class="text-sans" font-size="9" font-weight="600" fill="#38bdf8" text-anchor="middle">WS :52080</text>

    <!-- Terminal Log Lines -->
    <text x="50" y="128" class="text-mono" font-size="10" fill="#64748b">[12:34:01]</text>
    <rect x="110" y="118" width="42" height="14" rx="3" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="131" y="128" class="text-mono" font-size="8" font-weight="700" fill="#38bdf8" text-anchor="middle">SYSTEM</text>
    <text x="160" y="128" class="text-mono" font-size="10" fill="#e2e8f0">RPC session <tspan fill="#38bdf8">'mypai-main'</tspan> active</text>

    <text x="50" y="152" class="text-mono" font-size="10" fill="#64748b">[12:34:05]</text>
    <rect x="110" y="142" width="42" height="14" rx="3" fill="rgba(168, 85, 247, 0.15)"/>
    <text x="131" y="152" class="text-mono" font-size="8" font-weight="700" fill="#c084fc" text-anchor="middle">SIGNAL</text>
    <text x="160" y="152" class="text-mono" font-size="10" fill="#e2e8f0">Webhook turn from <tspan fill="#c084fc">+15559992222</tspan></text>

    <text x="50" y="176" class="text-mono" font-size="10" fill="#64748b">[12:34:06]</text>
    <rect x="110" y="166" width="42" height="14" rx="3" fill="rgba(245, 158, 11, 0.15)"/>
    <text x="131" y="176" class="text-mono" font-size="8" font-weight="700" fill="#fbbf24" text-anchor="middle">QUEUE</text>
    <text x="160" y="176" class="text-mono" font-size="10" fill="#e2e8f0">Enqueued priority turn <tspan fill="#fbbf24">P2</tspan></text>

    <text x="50" y="200" class="text-mono" font-size="10" fill="#64748b">[12:34:08]</text>
    <rect x="110" y="190" width="42" height="14" rx="3" fill="rgba(34, 197, 94, 0.15)"/>
    <text x="131" y="200" class="text-mono" font-size="8" font-weight="700" fill="#4ade80" text-anchor="middle">AGENT</text>
    <text x="160" y="200" class="text-mono" font-size="10" fill="#e2e8f0">Executing <tspan fill="#4ade80">'chat_mcp.get_unread'</tspan></text>

    <!-- Streaming Cursor -->
    <text x="50" y="224" class="text-mono" font-size="10" fill="#64748b">[12:34:10]</text>
    <rect x="110" y="214" width="42" height="14" rx="3" fill="rgba(59, 130, 246, 0.2)"/>
    <text x="131" y="224" class="text-mono" font-size="8" font-weight="700" fill="#60a5fa" text-anchor="middle">STREAM</text>
    <text x="160" y="224" class="text-mono" font-size="10" fill="#f8fafc">"Finalizing cron status telemetry..."</text>
    <rect x="420" y="213" width="6" height="13" fill="#3b82f6" filter="url(#accent-glow)"/>

    <!-- Bottom Input Form Box -->
    <rect x="45" y="475" width="460" height="58" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="55" y="485" width="280" height="38" rx="4" fill="#020617" stroke="#475569" stroke-width="1"/>
    <text x="65" y="508" class="text-sans" font-size="11" fill="#94a3b8">Type prompt turn...</text>

    <rect x="343" y="485" width="75" height="38" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="380" y="508" class="text-sans" font-size="10" font-weight="600" fill="#f8fafc" text-anchor="middle">Prompt ▾</text>

    <rect x="425" y="485" width="72" height="38" rx="4" fill="#3b82f6" filter="url(#accent-glow)"/>
    <text x="461" y="508" class="text-sans" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Submit</text>
  </g>

  <!-- ==================== SIDEBAR COLUMN (RIGHT - SCROLLABLE) ==================== -->
  <g filter="url(#card-shadow)">
    <!-- Sidebar Outer Border / Scroll Indicator Container -->
    <rect x="530" y="80" width="275" height="465" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    
    <!-- Sidebar Custom Scrollbar Track & Thumb -->
    <rect x="796" y="85" width="5" height="455" rx="2.5" fill="rgba(15, 23, 42, 0.6)"/>
    <rect x="796" y="110" width="5" height="120" rx="2.5" fill="#3b82f6" opacity="0.8"/>

    <!-- CARD 1: SESSION TELEMETRY -->
    <rect x="540" y="90" width="250" height="100" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="552" y="108" class="text-sans" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.5">SESSION TELEMETRY</text>
    
    <text x="552" y="130" class="text-sans" font-size="10" fill="#94a3b8">Fixed Session:</text>
    <text x="778" y="130" class="text-mono" font-size="10" font-weight="600" fill="#f8fafc" text-anchor="end">mypai-main</text>

    <text x="552" y="148" class="text-sans" font-size="10" fill="#94a3b8">PID / Queue Depth:</text>
    <text x="778" y="148" class="text-mono" font-size="10" fill="#f8fafc" text-anchor="end">12345 / P0</text>

    <text x="552" y="166" class="text-sans" font-size="10" fill="#94a3b8">Uptime:</text>
    <text x="778" y="166" class="text-mono" font-size="10" fill="#4ade80" text-anchor="end">01:23:45</text>

    <!-- CARD 2: CRON TELEMETRY & CONTROLS -->
    <rect x="540" y="200" width="250" height="110" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="552" y="218" class="text-sans" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.5">CRON CONTROLS</text>

    <text x="552" y="238" class="text-sans" font-size="10" fill="#94a3b8">Global Execution:</text>
    <text x="778" y="238" class="text-mono" font-size="10" font-weight="700" fill="#4ade80" text-anchor="end">ENABLED</text>

    <text x="552" y="254" class="text-sans" font-size="10" fill="#94a3b8">Active / Inactive Jobs:</text>
    <text x="778" y="254" class="text-mono" font-size="10" fill="#f8fafc" text-anchor="end">2 / 0</text>

    <!-- Global Toggle Button -->
    <rect x="552" y="268" width="226" height="28" rx="4" fill="rgba(239, 68, 68, 0.15)" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1"/>
    <text x="665" y="286" class="text-sans" font-size="10" font-weight="700" fill="#f87171" text-anchor="middle">Disable Global Execution</text>

    <!-- CARD 3: REGISTERED CRON TASKS (SIDEBAR INTEGRATED) -->
    <rect x="540" y="320" width="250" height="215" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="552" y="338" class="text-sans" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.5">REGISTERED TASKS</text>
    
    <rect x="735" y="326" width="45" height="16" rx="3" fill="#334155"/>
    <text x="757" y="337" class="text-sans" font-size="8" font-weight="700" fill="#f8fafc" text-anchor="middle">Refresh</text>

    <!-- Job Entry 1 -->
    <rect x="548" y="350" width="234" height="75" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="556" y="366" class="text-sans" font-size="10" font-weight="700" fill="#f8fafc">Work Sweep Audit</text>
    <text x="556" y="380" class="text-sans" font-size="8" fill="#94a3b8">Audit project tasks &amp; commitments</text>
    <text x="556" y="396" class="text-mono" font-size="9" fill="#38bdf8">*/30 * * * *</text>
    <rect x="635" y="387" width="30" height="12" rx="2" fill="rgba(59, 130, 246, 0.2)"/>
    <text x="650" y="396" class="text-mono" font-size="7" font-weight="700" fill="#60a5fa" text-anchor="middle">omp</text>

    <rect x="730" y="385" width="44" height="16" rx="3" fill="rgba(34, 197, 94, 0.2)"/>
    <text x="752" y="396" class="text-sans" font-size="8" font-weight="700" fill="#4ade80" text-anchor="middle">Run</text>

    <!-- Job Entry 2 -->
    <rect x="548" y="432" width="234" height="75" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="556" y="448" class="text-sans" font-size="10" font-weight="700" fill="#f8fafc">Hindsight Reflection</text>
    <text x="556" y="462" class="text-sans" font-size="8" fill="#94a3b8">Memory reflection sweep across banks</text>
    <text x="556" y="478" class="text-mono" font-size="9" fill="#38bdf8">0 */2 * * *</text>
    <rect x="635" y="469" width="30" height="12" rx="2" fill="rgba(168, 85, 247, 0.2)"/>
    <text x="650" y="478" class="text-mono" font-size="7" font-weight="700" fill="#c084fc" text-anchor="middle">http</text>

    <rect x="730" y="467" width="44" height="16" rx="3" fill="rgba(34, 197, 94, 0.2)"/>
    <text x="752" y="478" class="text-sans" font-size="8" font-weight="700" fill="#4ade80" text-anchor="middle">Run</text>
  </g>
</svg>
