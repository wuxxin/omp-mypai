<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyPai Daemon Core Architecture</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background-color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .diagram-container {
      width: 100%;
      max-width: 1100px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
      padding: 24px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div class="diagram-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 840" width="100%" height="100%" style="background-color: #f8fafc;">
      <defs>
        <!-- Typography -->
        <style>
          @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
          
          .title { font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; font-weight: 400; fill: #0f172a; }
          .eyebrow { font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 600; fill: #2563eb; letter-spacing: 0.12em; text-transform: uppercase; }
          .subtitle { font-family: 'Geist', sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
          .zone-title { font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 600; fill: #475569; letter-spacing: 0.08em; text-transform: uppercase; }
          
          .node-title { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; fill: #0f172a; }
          .node-sub { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 400; fill: #475569; }
          .node-tag { font-family: 'Geist Mono', monospace; font-size: 8px; font-weight: 600; fill: #2563eb; letter-spacing: 0.06em; }
          
          .arrow-label { font-family: 'Geist Mono', monospace; font-size: 8px; font-weight: 600; fill: #475569; letter-spacing: 0.06em; }
          .legend-text { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 500; fill: #475569; }
        </style>

        <!-- Arrow Markers -->
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
        </marker>
        <marker id="arrow-success" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
        </marker>
      </defs>

      <!-- Background -->
      <rect width="100%" height="100%" fill="#f8fafc"/>

      <!-- Header -->
      <g transform="translate(60, 44)">
        <text x="0" y="0" class="eyebrow">MYPAI DAEMON CORE ARCHITECTURE</text>
        <text x="0" y="28" class="title">Event-Driven Asynchronous RPC Queue Worker System</text>
        <text x="0" y="48" class="subtitle">Multi-Producer Single-Consumer Turn Serialization, Non-blocking Execution &amp; Priority Interrupt Routing</text>
      </g>

      <!-- Zone 1: Producers & Ingress -->
      <g transform="translate(60, 112)">
        <rect width="980" height="104" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="16" y="20" class="zone-title">1. MULTIPRODUCER INPUTS &amp; INGRESS LAYER</text>
        
        <!-- Producer Cards -->
        <g transform="translate(16, 32)">
          <!-- REST API -->
          <rect x="0" y="0" width="144" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
          <text x="72" y="24" class="node-title" text-anchor="middle">REST API Server</text>
          <text x="72" y="40" class="node-sub" text-anchor="middle">FastAPI / Uvicorn</text>

          <!-- WebUI WS -->
          <rect x="160" y="0" width="144" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
          <text x="232" y="24" class="node-title" text-anchor="middle">WebUI / WebSocket</text>
          <text x="232" y="40" class="node-sub" text-anchor="middle">/api/v1/ws</text>

          <!-- Signal Gateway -->
          <rect x="320" y="0" width="144" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
          <text x="392" y="24" class="node-title" text-anchor="middle">Signal Gateway</text>
          <text x="392" y="40" class="node-sub" text-anchor="middle">SignalClient</text>

          <!-- Cron Scheduler -->
          <rect x="480" y="0" width="144" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
          <text x="552" y="24" class="node-title" text-anchor="middle">Cron Scheduler</text>
          <text x="552" y="40" class="node-sub" text-anchor="middle">APScheduler Engine</text>

          <!-- Input Spooler -->
          <rect x="640" y="0" width="144" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
          <text x="712" y="24" class="node-title" text-anchor="middle">Input Spooler</text>
          <text x="712" y="40" class="node-sub" text-anchor="middle">File Drop &amp; STT</text>

          <!-- Job Executors -->
          <rect x="800" y="0" width="148" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
          <text x="874" y="24" class="node-title" text-anchor="middle">Job Executors</text>
          <text x="874" y="40" class="node-sub" text-anchor="middle">Python, Shell, HTTP</text>
        </g>
      </g>

      <!-- Connectors: Producers -> Queue -->
      <path d="M 132 200 L 132 240 M 292 200 L 292 240 M 452 200 L 452 240 M 612 200 L 612 240 M 772 200 L 772 240 M 934 200 L 934 240" 
            stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

      <!-- Zone 2: Priority Event Queue -->
      <g transform="translate(60, 248)">
        <rect width="980" height="136" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="16" y="20" class="zone-title">2. EVENT QUEUE (PRIORITIZED MPSC QUEUE)</text>

        <!-- Priority 0 (Focal Accent) -->
        <g transform="translate(16, 32)">
          <rect x="0" y="0" width="300" height="88" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
          <rect x="12" y="10" width="76" height="16" rx="3" fill="#dbeafe"/>
          <text x="50" y="21" class="node-tag" text-anchor="middle">PRIORITY 0</text>
          <text x="16" y="44" class="node-title">High-Priority Interrupts</text>
          <text x="16" y="62" class="node-sub">steer, abort, abort_retry, abort_and_prompt</text>
          <text x="16" y="74" class="node-sub">ui_interaction, ui_confirmation, ui_value</text>
        </g>

        <!-- Priority 1 -->
        <g transform="translate(332, 32)">
          <rect x="0" y="0" width="300" height="88" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
          <rect x="12" y="10" width="76" height="16" rx="3" fill="#e2e8f0"/>
          <text x="50" y="21" class="node-tag" fill="#475569" text-anchor="middle">PRIORITY 1</text>
          <text x="16" y="44" class="node-title">Interactive Human Turns</text>
          <text x="16" y="62" class="node-sub">webui prompt submission</text>
          <text x="16" y="74" class="node-sub">signal incoming messages</text>
        </g>

        <!-- Priority 2 -->
        <g transform="translate(648, 32)">
          <rect x="0" y="0" width="316" height="88" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
          <rect x="12" y="10" width="76" height="16" rx="3" fill="#e2e8f0"/>
          <text x="50" y="21" class="node-tag" fill="#475569" text-anchor="middle">PRIORITY 2</text>
          <text x="16" y="44" class="node-title">Automated Background Tasks</text>
          <text x="16" y="62" class="node-sub">cron scheduled jobs &amp; spooler drops</text>
          <text x="16" y="74" class="node-sub">executor result dispatches (result_action)</text>
        </g>
      </g>

      <!-- Connectors: Queue -> Worker -->
      <path d="M 550 384 L 550 424" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
      <rect x="490" y="394" width="120" height="16" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="550" y="405" class="arrow-label" text-anchor="middle">get_next() FIFO/PRIO</text>

      <!-- Zone 3: Asynchronous Queue Worker Loop -->
      <g transform="translate(60, 428)">
        <rect width="980" height="104" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="16" y="20" class="zone-title">3. ASYNCHRONOUS QUEUE WORKER LOOP</text>

        <!-- Worker Loop Component -->
        <g transform="translate(16, 32)">
          <rect x="0" y="0" width="456" height="56" rx="6" fill="#f8fafc" stroke="#0f172a" stroke-width="1.2"/>
          <text x="20" y="24" class="node-title">queue_worker_loop Coroutine</text>
          <text x="20" y="40" class="node-sub">P1/P2 turn dispatch via non-blocking execute_turn()</text>
        </g>

        <!-- Immediate Interrupt Dispatcher -->
        <g transform="translate(488, 32)">
          <rect x="0" y="0" width="476" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
          <text x="20" y="24" class="node-title">P0 Immediate Interrupt Dispatcher</text>
          <text x="20" y="40" class="node-sub">Executes steer / abort mid-turn without awaiting turn lock</text>
        </g>
      </g>

      <!-- Connectors: Worker -> Session Manager -->
      <path d="M 288 532 L 288 572" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="238" y="544" width="100" height="16" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="288" y="555" class="arrow-label" text-anchor="middle">execute_turn()</text>

      <path d="M 726 532 L 726 620 L 590 620" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
      <rect x="640" y="560" width="120" height="16" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="0.8"/>
      <text x="700" y="571" class="arrow-label" text-anchor="middle" fill="#2563eb">steer() / abort()</text>

      <!-- Zone 4: OMPSessionManager & Persistent OMP Subprocess -->
      <g transform="translate(60, 576)">
        <rect width="980" height="160" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
        <text x="16" y="20" class="zone-title">4. OMP SESSION MANAGER &amp; PERSISTENT RPC CONNECTION</text>

        <!-- Session Manager -->
        <g transform="translate(16, 32)">
          <rect x="0" y="0" width="280" height="112" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
          <text x="16" y="24" class="node-title">OMPSessionManager</text>
          <text x="16" y="42" class="node-sub">Session UUID SQLite Persistence</text>
          <text x="16" y="58" class="node-sub">Auto Crash Triage &amp; Reconnect</text>
          <text x="16" y="74" class="node-sub">ACP Host Tools &amp; Headless UI</text>
          <text x="16" y="90" class="node-sub">Direct State/Stats API endpoints</text>
        </g>

        <!-- Persistent RpcClient Process -->
        <g transform="translate(312, 32)">
          <rect x="0" y="0" width="280" height="112" rx="6" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5"/>
          <text x="16" y="24" class="node-title" fill="#0f172a">RpcClient Subprocess</text>
          <text x="16" y="42" class="node-sub" fill="#1e293b">omp --mode rpc --profile mypai</text>
          <text x="16" y="58" class="node-sub" fill="#334155">Single Persistent Child Process</text>
          <text x="16" y="74" class="node-sub" fill="#334155">Non-blocking prompt() / steer()</text>
          <text x="16" y="90" class="node-sub" fill="#0369a1">Zero isolated temp clients</text>
        </g>

        <!-- Event Listeners & Signal -->
        <g transform="translate(608, 32)">
          <rect x="0" y="0" width="356" height="112" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.2"/>
          <text x="16" y="24" class="node-title" fill="#065f46">RPC Event Listeners &amp; Async Signal</text>
          <text x="16" y="44" class="node-sub" fill="#047857">on_turn_end &amp; on_agent_end Listeners</text>
          <text x="16" y="62" class="node-sub" fill="#047857">_turn_done_event (asyncio.Event)</text>
          <text x="16" y="80" class="node-sub" fill="#047857">Live Streaming WebSocket Broadcasts</text>
          <text x="16" y="96" class="node-sub" fill="#059669">Unblocks worker on turn completion</text>
        </g>
      </g>

      <!-- Connectors inside Zone 4 -->
      <path d="M 356 664 L 372 664" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
      <path d="M 652 664 L 668 664" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-success)"/>

      <!-- Footer / Legend -->
      <g transform="translate(60, 768)">
        <line x1="0" y1="0" x2="980" y2="0" stroke="#e2e8f0" stroke-width="1"/>
        <text x="0" y="20" class="legend-text">LEGEND:</text>
        
        <rect x="60" y="11" width="14" height="10" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
        <text x="82" y="20" class="legend-text">Priority 0 Interrupts</text>

        <rect x="220" y="11" width="14" height="10" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="242" y="20" class="legend-text">Standard Component</text>

        <rect x="380" y="11" width="14" height="10" rx="2" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.2"/>
        <text x="402" y="20" class="legend-text">Persistent Core Subprocess</text>

        <rect x="580" y="11" width="14" height="10" rx="2" fill="#f0fdf4" stroke="#059669" stroke-width="1"/>
        <text x="602" y="20" class="legend-text">Event Listener &amp; Completion Signal</text>

        <text x="980" y="20" class="legend-text" text-anchor="end">mypai_tools v1.0.0</text>
      </g>
    </svg>
  </div>
</body>
</html>
