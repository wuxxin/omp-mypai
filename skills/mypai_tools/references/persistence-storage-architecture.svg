<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');

      .bg-paper { fill: #faf7f2; }
      .zone-bg { fill: rgba(45, 49, 66, 0.02); stroke: rgba(45, 49, 66, 0.12); stroke-width: 0.8; }
      .zone-eyebrow { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #4f5d75; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }
      .title-main { font-family: 'Instrument Serif', serif; font-size: 26px; fill: #1c1917; }
      .subtitle { font-family: 'Geist', sans-serif; font-size: 11px; fill: #4f5d75; }
      .header-tag { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #eb6c36; letter-spacing: 0.14em; font-weight: 600; }

      .node-name { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; fill: #1c1917; }
      .node-name-focal { font-family: 'Geist', sans-serif; font-size: 13px; font-weight: 700; fill: #eb6c36; }
      .node-sub { font-family: 'Geist Mono', monospace; font-size: 8.5px; fill: #4f5d75; }
      .node-body { font-family: 'Geist', sans-serif; font-size: 9.5px; fill: #334155; }
      .tag-text { font-family: 'Geist Mono', monospace; font-size: 7px; letter-spacing: 0.08em; font-weight: 600; }
      
      .conn-label { font-family: 'Geist Mono', monospace; font-size: 7.5px; letter-spacing: 0.08em; font-weight: 600; }
      .legend-text { font-family: 'Geist Mono', monospace; font-size: 8.5px; fill: #4f5d75; }
    </style>

    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>

  <rect width="1200" height="840" class="bg-paper"/>

  <!-- ==================== HEADER ==================== -->
  <text x="40" y="28" class="header-tag">SUBLEVEL ARCHITECTURE: SQLITE MULTI-WORKSPACE STORAGE</text>
  <text x="40" y="56" class="title-main">myPAI Persistence &amp; Storage Model</text>
  <text x="40" y="76" class="subtitle">Workspace directory partitioning, SQLite WAL mode, 30s busy timeout, database schemas, and consumer concurrency</text>

  <!-- ==================== ZONES ==================== -->
  <!-- Zone 1: Multi-Workspace Pathing -->
  <rect x="40" y="96" width="260" height="664" rx="8" class="zone-bg"/>
  <rect x="52" y="100" width="220" height="12" rx="2" fill="#faf7f2"/>
  <text x="56" y="109" class="zone-eyebrow">1. PATH HASHING &amp; PARTITIONS</text>

  <!-- Zone 2: SQLite WAL Schemas (Focal) -->
  <rect x="324" y="96" width="472" height="664" rx="8" class="zone-bg" stroke="rgba(235, 108, 54, 0.25)" stroke-width="1"/>
  <rect x="336" y="100" width="340" height="12" rx="2" fill="#faf7f2"/>
  <text x="340" y="109" class="zone-eyebrow" fill="#eb6c36">2. SQLITE WAL DATABASE &amp; SCHEMAS</text>

  <!-- Zone 3: Consumers & Session Factory -->
  <rect x="820" y="96" width="340" height="664" rx="8" class="zone-bg"/>
  <rect x="832" y="100" width="280" height="12" rx="2" fill="#faf7f2"/>
  <text x="836" y="109" class="zone-eyebrow">3. DAEMON CONSUMERS &amp; THREAD SAFETY</text>

  <!-- ==================== CONNECTORS ==================== -->
  <!-- Path Engine -> Database File -->
  <path d="M 276 348 L 348 348" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="284" y="334" width="56" height="12" rx="2" fill="#faf7f2"/>
  <text x="312" y="343" class="conn-label" fill="#eb6c36" text-anchor="middle">MOUNT DB</text>

  <!-- DB Schemas -> Session Factory -->
  <path d="M 772 348 L 844 348" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="780" y="334" width="56" height="12" rx="2" fill="#faf7f2"/>
  <text x="808" y="343" class="conn-label" fill="#eb6c36" text-anchor="middle">SESSION</text>

  <!-- Consumers -> Session Factory -->
  <path d="M 990 496 L 990 432" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="948" y="456" width="84" height="12" rx="2" fill="#faf7f2"/>
  <text x="990" y="465" class="conn-label" fill="#4f5d75" text-anchor="middle">ASYNC QUERIES</text>

  <!-- ==================== NODES ==================== -->

  <!-- ZONE 1 NODES: Path Hashing & Partitions -->
  <!-- Target Workspaces -->
  <rect x="64" y="128" width="212" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="76" y="146" class="tag-text" fill="#4f5d75">WORKSPACES</text>
  <text x="170" y="156" class="node-name" text-anchor="middle">Target Project Workspaces</text>
  <text x="170" y="174" class="node-sub" text-anchor="middle">/home/user/code/mypai</text>
  <text x="170" y="190" class="node-sub" text-anchor="middle">/home/user/code/another-repo</text>
  <text x="170" y="206" class="node-body" text-anchor="middle">Distinct codebase roots</text>

  <!-- Hash Engine -->
  <rect x="64" y="248" width="212" height="128" rx="6" fill="rgba(235, 108, 54, 0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="76" y="266" class="tag-text" fill="#eb6c36">HASH ENGINE</text>
  <text x="170" y="276" class="node-name-focal" text-anchor="middle">resolve_agent_dir()</text>
  <text x="170" y="296" class="node-sub" text-anchor="middle">get_agent_dir_info(agent_dir)</text>
  <text x="170" y="314" class="node-body" text-anchor="middle">1. Resolves canonical absolute path</text>
  <text x="170" y="330" class="node-body" text-anchor="middle">2. Extracts basedir name</text>
  <text x="170" y="346" class="node-body" text-anchor="middle">3. Computes SHA-256 (first 8 chars)</text>
  <text x="170" y="364" class="node-sub" fill="#eb6c36" text-anchor="middle">Stable hash across reboots</text>

  <!-- Profile Directory Hierarchy -->
  <rect x="64" y="396" width="212" height="144" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1.2"/>
  <text x="76" y="414" class="tag-text" fill="#1c1917">STORAGE HIERARCHY</text>
  <text x="170" y="424" class="node-name" text-anchor="middle">Profile Data Directory</text>
  <text x="170" y="444" class="node-sub" text-anchor="middle">Default: ~/.omp/profiles/&lt;profile&gt;/data/</text>
  <text x="170" y="460" class="node-sub" text-anchor="middle">omp-mypai/daemon/</text>
  <text x="170" y="478" class="node-body" text-anchor="middle">agent-{basedir}-{hash}.db</text>
  <text x="170" y="496" class="node-sub" fill="#eb6c36" text-anchor="middle">e.g. agent-mypai-a1b2c3d4.db</text>
  <text x="170" y="512" class="node-body" text-anchor="middle">e.g. agent-repo2-f5e6d7c8.db</text>
  <text x="170" y="528" class="node-sub" text-anchor="middle">Fallback: $MYPAI_PLUGIN_DATA</text>

  <!-- Isolation Guarantees -->
  <rect x="64" y="560" width="212" height="152" rx="6" fill="#ffffff" stroke="rgba(45, 49, 66, 0.12)" stroke-width="1"/>
  <text x="76" y="578" class="tag-text" fill="#4f5d75">ISOLATION</text>
  <text x="170" y="588" class="node-name" text-anchor="middle">Zero State Contamination</text>
  <text x="170" y="608" class="node-body">• Different projects never share tasks.</text>
  <text x="170" y="626" class="node-body">• Independent cron job registries.</text>
  <text x="170" y="644" class="node-body">• Separate session UUIDs.</text>
  <text x="170" y="662" class="node-sub" fill="#eb6c36">• Clean multi-tenant developer workflow.</text>
  <text x="170" y="680" class="node-body">• Instant workspace switching.</text>
  <text x="170" y="698" class="node-sub" text-anchor="middle">Completely autonomous storage silos</text>

  <!-- ZONE 2 NODES: SQLite WAL Database & Schemas (Focal Box) -->
  <!-- Engine Properties Box -->
  <rect x="348" y="128" width="424" height="96" rx="6" fill="rgba(235, 108, 54, 0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="360" y="148" class="node-name-focal">SQLite Engine &amp; Concurrency Flags</text>
  <text x="360" y="168" class="node-sub">Driver: aiosqlite + sqlite3 • SQLAlchemy DeclarativeBase</text>
  <text x="360" y="188" class="node-body">• PRAGMA journal_mode=WAL (Write-Ahead Logging for high concurrency)</text>
  <text x="360" y="206" class="node-body">• timeout=30.0 (30-second busy timeout eliminates database lock errors)</text>

  <!-- Table 1: cron_jobs -->
  <rect x="348" y="240" width="424" height="152" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1.2"/>
  <text x="360" y="260" class="node-name">Table: cron_jobs (Scheduled &amp; Background Tasks)</text>
  <text x="360" y="280" class="node-sub">Columns &amp; Data Types:</text>
  <text x="360" y="300" class="node-body">id: String (PK) • name: String • cron: String • enabled: Boolean</text>
  <text x="360" y="318" class="node-body">kind: Enum ('omp', 'shell', 'http', 'python', 'acp') • action: Enum</text>
  <text x="360" y="336" class="node-body">args: JSON List • kwargs: JSON Dict • opts: JSON Dict • result: JSON Dict</text>
  <text x="360" y="354" class="node-sub" fill="#eb6c36">last_run: DateTime • last_status: String • call_count: Integer</text>
  <text x="360" y="372" class="node-sub">last_duration_sec: Float • last_output: Text • last_error: Text</text>

  <!-- Table 2: settings -->
  <rect x="348" y="408" width="424" height="120" rx="6" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.2"/>
  <text x="360" y="428" class="node-name">Table: settings (Daemon &amp; Subsystem State)</text>
  <text x="360" y="448" class="node-sub">Columns: key: String (PK) • value: Text</text>
  <text x="360" y="468" class="node-body">• session_uuid: Persistent OMP RPC session UUID for seamless reattach.</text>
  <text x="360" y="486" class="node-body">• acp_execution_state: 'running' | 'suspended' | 'shutdown'</text>
  <text x="360" y="504" class="node-sub" fill="#2e5aa8">get_setting(key) / set_setting(key, val) / delete_setting(key)</text>

  <!-- Table 3: turn_history -->
  <rect x="348" y="544" width="424" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="360" y="564" class="node-name">Table: turn_history (Audit &amp; Queue Telemetry)</text>
  <text x="360" y="584" class="node-sub">Columns: task_id: String (PK) • mode: String • source: String</text>
  <text x="360" y="604" class="node-body">prompt: Text • output: Text • error: Text • status: String</text>
  <text x="360" y="622" class="node-body">created_at: DateTime • completed_at: DateTime • duration_sec: Float</text>
  <text x="360" y="640" class="node-sub" fill="#eb6c36">token_usage: JSON (prompt_tokens, completion_tokens)</text>
  <text x="360" y="656" class="node-body">Accessible via /api/v1/session/history for UI review</text>

  <!-- ZONE 3 NODES: Daemon Consumers & Concurrency Safety -->
  <!-- Session Factory -->
  <rect x="844" y="128" width="292" height="120" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1.2"/>
  <rect x="856" y="136" width="64" height="12" rx="2" fill="transparent" stroke="#1c1917" stroke-width="0.8"/>
  <text x="888" y="145" class="tag-text" fill="#1c1917" text-anchor="middle">FACTORY</text>
  <text x="990" y="156" class="node-name" text-anchor="middle">Thread-Safe Session Factory</text>
  <text x="990" y="174" class="node-sub" text-anchor="middle">get_engine(agent_dir) • get_session()</text>
  <text x="990" y="192" class="node-body" text-anchor="middle">Connection pooling with scoped sessions</text>
  <text x="990" y="208" class="node-body" text-anchor="middle">Automatic table migration on startup</text>
  <text x="990" y="224" class="node-sub" text-anchor="middle">Context-managed session commits &amp; rollbacks</text>

  <!-- CronScheduler Consumer -->
  <rect x="844" y="264" width="292" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="990" y="286" class="node-name" text-anchor="middle">CronScheduler Engine</text>
  <text x="990" y="304" class="node-sub" text-anchor="middle">sync_jobs_from_db()</text>
  <text x="990" y="322" class="node-body" text-anchor="middle">Reads cron definitions &amp; triggers</text>
  <text x="990" y="338" class="node-sub" text-anchor="middle">Records last_run, call_count, latency</text>

  <!-- OMPSessionManager Consumer -->
  <rect x="844" y="376" width="292" height="96" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1.2"/>
  <text x="990" y="398" class="node-name" text-anchor="middle">OMPSessionManager</text>
  <text x="990" y="416" class="node-sub" text-anchor="middle">Session UUID Recovery</text>
  <text x="990" y="434" class="node-body" text-anchor="middle">Persists session_uuid on creation</text>
  <text x="990" y="450" class="node-sub" fill="#eb6c36" text-anchor="middle">Resumes session across daemon restarts</text>

  <!-- AcpState Consumer -->
  <rect x="844" y="488" width="292" height="96" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="990" y="510" class="node-name-focal" text-anchor="middle">AcpState Controller</text>
  <text x="990" y="528" class="node-sub" text-anchor="middle">Execution State Gatekeeper</text>
  <text x="990" y="546" class="node-body" text-anchor="middle">Persists acp_execution_state</text>
  <text x="990" y="562" class="node-sub" text-anchor="middle">Survives full system reboots</text>

  <!-- TurnQueue Consumer -->
  <rect x="844" y="600" width="292" height="112" rx="6" fill="#ffffff" stroke="#2e5aa8" stroke-width="1"/>
  <text x="990" y="622" class="node-name" text-anchor="middle">TurnQueue Arbiter</text>
  <text x="990" y="640" class="node-sub" text-anchor="middle">Audit Log Persistence</text>
  <text x="990" y="658" class="node-body" text-anchor="middle">Records completed &amp; aborted turns</text>
  <text x="990" y="674" class="node-sub" fill="#2e5aa8" text-anchor="middle">Duration, prompt text, token usage</text>
  <text x="990" y="690" class="node-body" text-anchor="middle">Powers UI session history tab</text>

  <!-- ==================== LEGEND STRIP ==================== -->
  <line x1="40" y1="784" x2="1160" y2="784" stroke="rgba(45, 49, 66, 0.12)" stroke-width="0.8"/>
  <text x="40" y="804" class="zone-eyebrow">LEGEND</text>
  
  <rect x="120" y="796" width="16" height="10" rx="2" fill="rgba(235, 108, 54, 0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="144" y="805" class="legend-text">Hash Engine / WAL Mode / ACP State</text>

  <rect x="440" y="796" width="16" height="10" rx="2" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="464" y="805" class="legend-text">Core Tables &amp; Session Factory</text>

  <rect x="700" y="796" width="16" height="10" rx="2" fill="#ffffff" stroke="#2e5aa8" stroke-width="1"/>
  <text x="724" y="805" class="legend-text">Settings &amp; Audit Logs</text>

  <line x1="920" y1="801" x2="944" y2="801" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="952" y="805" class="legend-text">Database Mount &amp; Session Dispatch</text>
</svg>
