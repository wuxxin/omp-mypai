<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" style="max-width: 100%; height: auto;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#78716c" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b5523a" />
    </marker>
    <marker id="arrow-link" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e5aa8" />
    </marker>
    
    <!-- Drop shadow filter for cards -->
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1c1917" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Canvas Outer Background Container -->
  <rect width="840" height="560" rx="12" fill="#faf7f2" stroke="#e7e4df" stroke-width="1"/>

  <!-- ==================== TIER 1: MYPAI_DAEMON CORE PROCESS ==================== -->
  <rect x="35" y="25" width="770" height="270" rx="8" fill="rgba(252, 250, 246, 0.8)" stroke="#b5523a" stroke-width="1.5"/>
  <text x="50" y="44" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#b5523a" letter-spacing="0.8">MYPAI_DAEMON CORE HOST PROCESS (PORT 52080)</text>

  <!-- Component 1: Primary Agent (Focal Node) -->
  <g filter="url(#card-shadow)">
    <rect x="55" y="60" width="200" height="110" rx="6" fill="#ffffff" stroke="#b5523a" stroke-width="1.5"/>
    <rect x="65" y="70" width="76" height="16" rx="3" fill="#b5523a"/>
    <text x="103" y="81" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">PRIMARY AGENT</text>
    <text x="155" y="112" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1c1917" text-anchor="middle">Primary Daemon Agent</text>
    <text x="155" y="130" font-family="monospace" font-size="10" fill="#78716c" text-anchor="middle">omp --mode rpc</text>
    <text x="155" y="148" font-family="monospace" font-size="9" fill="#b5523a" text-anchor="middle">RPC Session Host</text>
  </g>

  <!-- Component 2: OMPSessionManager -->
  <g filter="url(#card-shadow)">
    <rect x="310" y="60" width="210" height="90" rx="6" fill="#ffffff" stroke="#d6d0c4" stroke-width="1"/>
    <text x="415" y="85" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1c1917" text-anchor="middle">OMPSessionManager</text>
    <text x="415" y="105" font-family="monospace" font-size="10" fill="#78716c" text-anchor="middle">set_custom_tools()</text>
    <text x="415" y="123" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" fill="#2e5aa8" text-anchor="middle">Registers 8 Host Tools</text>
  </g>

  <!-- Component 3: ACP API Router -->
  <g filter="url(#card-shadow)">
    <rect x="580" y="60" width="205" height="90" rx="6" fill="#ffffff" stroke="#d6d0c4" stroke-width="1"/>
    <text x="682" y="85" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1c1917" text-anchor="middle">ACP API Router</text>
    <text x="682" y="105" font-family="monospace" font-size="9" fill="#78716c" text-anchor="middle">/api/v1/acp/*</text>
    <text x="682" y="123" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" fill="#78716c" text-anchor="middle">/status · /enable · /suspend</text>
  </g>

  <!-- Component 4: AcpDelegationManager -->
  <g filter="url(#card-shadow)">
    <rect x="310" y="185" width="210" height="90" rx="6" fill="#ffffff" stroke="#d6d0c4" stroke-width="1"/>
    <text x="415" y="212" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1c1917" text-anchor="middle">AcpDelegationManager</text>
    <text x="415" y="232" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" fill="#78716c" text-anchor="middle">Process Pool &amp; Auto-Restart</text>
    <text x="415" y="250" font-family="monospace" font-size="9" fill="#78716c" text-anchor="middle">Context Recovery via Resume</text>
  </g>

  <!-- Component 5: SQLite SettingsModel -->
  <g filter="url(#card-shadow)">
    <rect x="580" y="185" width="205" height="90" rx="6" fill="rgba(245, 242, 237, 0.6)" stroke="#d6d0c4" stroke-width="1"/>
    <text x="682" y="212" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1c1917" text-anchor="middle">SQLite SettingsModel</text>
    <text x="682" y="232" font-family="monospace" font-size="9" fill="#78716c" text-anchor="middle">acp_execution_state</text>
    <text x="682" y="250" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" stroke-width="0" fill="#b5523a" text-anchor="middle">running | suspended</text>
  </g>

  <!-- Internal Connectors in Tier 1 -->
  <!-- Primary Agent <-> OMPSessionManager -->
  <line x1="255" y1="100" x2="310" y2="100" stroke="#b5523a" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <rect x="258" y="86" width="50" height="12" rx="2" fill="#ffffff" stroke="#b5523a" stroke-width="0.6"/>
  <text x="283" y="95" font-family="monospace" font-size="7" font-weight="700" fill="#b5523a" text-anchor="middle">TOOLS</text>

  <!-- OMPSessionManager -> AcpDelegationManager -->
  <line x1="415" y1="150" x2="415" y2="185" stroke="#78716c" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Router -> AcpDelegationManager & State -->
  <line x1="682" y1="150" x2="682" y2="185" stroke="#78716c" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="580" y1="105" x2="520" y2="105" stroke="#78716c" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- AcpDelegationManager <-> SQLite SettingsModel -->
  <line x1="520" y1="230" x2="580" y2="230" stroke="#78716c" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>


  <!-- ==================== TIER 2: WORKER AGENT SUBPROCESS POOL ==================== -->
  <rect x="35" y="330" width="770" height="180" rx="8" fill="rgba(245, 242, 237, 0.6)" stroke="#d6d0c4" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="50" y="349" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#78716c" letter-spacing="0.8">WORKER AGENT SUBPROCESS POOL (ISOLATED WORKSPACES)</text>

  <!-- Connector Tier 1 -> Tier 2 -->
  <line x1="415" y1="275" x2="415" y2="375" stroke="#2e5aa8" stroke-width="2" marker-end="url(#arrow-link)"/>
  <rect x="345" y="318" width="140" height="18" rx="3" fill="#ffffff" stroke="#2e5aa8" stroke-width="0.8"/>
  <text x="415" y="330" font-family="monospace" font-size="9" font-weight="700" fill="#2e5aa8" text-anchor="middle">ACP JSON-RPC (STDIO PIPE)</text>

  <!-- Worker Subprocess Card 1 -->
  <g filter="url(#card-shadow)">
    <rect x="160" y="375" width="240" height="110" rx="6" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.5"/>
    <rect x="170" y="385" width="80" height="14" rx="2" fill="rgba(46, 90, 168, 0.1)"/>
    <text x="210" y="395" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#2e5aa8" text-anchor="middle">WORKER 1</text>
    <text x="280" y="420" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1c1917" text-anchor="middle">Worker Session A</text>
    <text x="280" y="440" font-family="monospace" font-size="10" fill="#78716c" text-anchor="middle">omp --mode acp</text>
    <text x="280" y="460" font-family="monospace" font-size="9" fill="#2e5aa8" text-anchor="middle">Target cwd: workspace-A</text>
  </g>

  <!-- Worker Subprocess Card 2 -->
  <g filter="url(#card-shadow)">
    <rect x="440" y="375" width="240" height="110" rx="6" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.5"/>
    <rect x="450" y="385" width="80" height="14" rx="2" fill="rgba(46, 90, 168, 0.1)"/>
    <text x="490" y="395" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#2e5aa8" text-anchor="middle">WORKER 2</text>
    <text x="560" y="420" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1c1917" text-anchor="middle">Worker Session B</text>
    <text x="560" y="440" font-family="monospace" font-size="10" fill="#78716c" text-anchor="middle">omp --mode acp</text>
    <text x="560" y="460" font-family="monospace" font-size="9" fill="#2e5aa8" text-anchor="middle">Target cwd: workspace-B</text>
  </g>
</svg>
