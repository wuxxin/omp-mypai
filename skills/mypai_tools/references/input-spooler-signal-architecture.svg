<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');

      .bg-paper { fill: #faf7f2; }
      .zone-bg { fill: rgba(45, 49, 66, 0.02); stroke: rgba(45, 49, 66, 0.12); stroke-width: 0.8; }
      .zone-eyebrow { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #4f5d75; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }
      .title-main { font-family: 'Instrument Serif', serif; font-size: 26px; fill: #1c1917; }
      .subtitle { font-family: 'Geist', sans-serif; font-size: 11px; fill: #4f5d75; }
      .header-tag { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #eb6c36; letter-spacing: 0.14em; font-weight: 600; }

      .node-name { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; fill: #1c1917; }
      .node-name-focal { font-family: 'Geist', sans-serif; font-size: 13px; font-weight: 700; fill: #eb6c36; }
      .node-sub { font-family: 'Geist Mono', monospace; font-size: 8.5px; fill: #4f5d75; }
      .node-body { font-family: 'Geist', sans-serif; font-size: 9.5px; fill: #334155; }
      .tag-text { font-family: 'Geist Mono', monospace; font-size: 7px; letter-spacing: 0.08em; font-weight: 600; }
      
      .conn-label { font-family: 'Geist Mono', monospace; font-size: 7.5px; letter-spacing: 0.08em; font-weight: 600; }
      .legend-text { font-family: 'Geist Mono', monospace; font-size: 8.5px; fill: #4f5d75; }
    </style>

    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>

  <rect width="1200" height="840" class="bg-paper"/>

  <!-- ==================== HEADER ==================== -->
  <text x="40" y="28" class="header-tag">SUBLEVEL ARCHITECTURE: MULTI-MODAL &amp; REMOTE INGRESS</text>
  <text x="40" y="56" class="title-main">myPAI Input Spooler &amp; Signal Subsystem</text>
  <text x="40" y="76" class="subtitle">Audio STT inbox watcher, Hindsight memory injection, Signal REST gateway, sender whitelist filter, and TurnQueue dispatch</text>

  <!-- ==================== ZONES ==================== -->
  <!-- Zone 1: Audio Spooler Subsystem -->
  <rect x="40" y="96" width="260" height="664" rx="8" class="zone-bg"/>
  <rect x="52" y="100" width="220" height="12" rx="2" fill="#faf7f2"/>
  <text x="56" y="109" class="zone-eyebrow">1. INPUT SPOOLER (AUDIO STT)</text>

  <!-- Zone 2: Signal Gateway & Whitelist Filter (Focal) -->
  <rect x="324" y="96" width="472" height="664" rx="8" class="zone-bg" stroke="rgba(235, 108, 54, 0.25)" stroke-width="1"/>
  <rect x="336" y="100" width="340" height="12" rx="2" fill="#faf7f2"/>
  <text x="340" y="109" class="zone-eyebrow" fill="#eb6c36">2. SIGNAL GATEWAY &amp; SECURITY FILTER</text>

  <!-- Zone 3: TurnQueue Ingestion & Agent Loop -->
  <rect x="820" y="96" width="340" height="664" rx="8" class="zone-bg"/>
  <rect x="832" y="100" width="280" height="12" rx="2" fill="#faf7f2"/>
  <text x="836" y="109" class="zone-eyebrow">3. QUEUE INGESTION &amp; AGENT EXECUTION</text>

  <!-- ==================== CONNECTORS ==================== -->
  <!-- Audio Formulator -> TurnQueue -->
  <path d="M 276 564 L 844 564" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="520" y="550" width="84" height="12" rx="2" fill="#faf7f2"/>
  <text x="562" y="559" class="conn-label" fill="#4f5d75" text-anchor="middle">ENQUEUE AUDIO</text>

  <!-- Signal Webhook -> Whitelist Guard -->
  <path d="M 560 280 L 560 316" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="510" y="290" width="100" height="12" rx="2" fill="#faf7f2"/>
  <text x="560" y="299" class="conn-label" fill="#eb6c36" text-anchor="middle">VERIFY SENDER</text>

  <!-- Signal Guard -> TurnQueue Notification -->
  <path d="M 772 400 L 844 400" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="780" y="386" width="56" height="12" rx="2" fill="#faf7f2"/>
  <text x="808" y="395" class="conn-label" fill="#2e5aa8" text-anchor="middle">NOTIFY</text>

  <!-- Agent -> chat_mcp Read & Reply -->
  <path d="M 990 448 L 990 492" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="948" y="462" width="84" height="12" rx="2" fill="#faf7f2"/>
  <text x="990" y="471" class="conn-label" fill="#eb6c36" text-anchor="middle">CALL MCP</text>

  <!-- MCP -> Outbound Signal -->
  <path d="M 844 644 L 772 644" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="780" y="630" width="56" height="12" rx="2" fill="#faf7f2"/>
  <text x="808" y="639" class="conn-label" fill="#2e5aa8" text-anchor="middle">REPLY</text>

  <!-- ==================== NODES ==================== -->

  <!-- ZONE 1 NODES: Audio Spooler Subsystem -->
  <!-- Inbox Directory -->
  <rect x="64" y="128" width="212" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="76" y="146" class="tag-text" fill="#4f5d75">STORAGE</text>
  <text x="170" y="156" class="node-name" text-anchor="middle">Spooler Inbox Directory</text>
  <text x="170" y="174" class="node-sub" text-anchor="middle">~/.omp/spooler/inbox/*.wav</text>
  <text x="170" y="190" class="node-body" text-anchor="middle">Audio &amp; text recording ingestion</text>
  <text x="170" y="204" class="node-sub" text-anchor="middle">Async file watcher loop</text>

  <!-- Whisper STT -->
  <rect x="64" y="240" width="212" height="92" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1.2"/>
  <text x="76" y="258" class="tag-text" fill="#1c1917">SPEECH-TO-TEXT</text>
  <text x="170" y="268" class="node-name" text-anchor="middle">Whisper STT Engine</text>
  <text x="170" y="288" class="node-sub" text-anchor="middle">transcribe_audio(file_path)</text>
  <text x="170" y="304" class="node-body" text-anchor="middle">Converts speech audio to text prompt</text>
  <text x="170" y="320" class="node-sub" text-anchor="middle">Zero external API dependencies</text>

  <!-- Hindsight Memory Injection -->
  <rect x="64" y="356" width="212" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="76" y="374" class="tag-text" fill="#4f5d75">MEMORY</text>
  <text x="170" y="384" class="node-name" text-anchor="middle">Hindsight Context Injection</text>
  <text x="170" y="404" class="node-sub" text-anchor="middle">retain_hindsight(transcript)</text>
  <text x="170" y="420" class="node-body" text-anchor="middle">Extracts relevant task tags &amp; memory</text>
  <text x="170" y="436" class="node-sub" text-anchor="middle">Appends memory context to turn</text>

  <!-- Audio Turn Formulator -->
  <rect x="64" y="480" width="212" height="168" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="76" y="498" class="tag-text" fill="#4f5d75">DISPATCHER</text>
  <text x="170" y="508" class="node-name" text-anchor="middle">Spooler Turn Dispatcher</text>
  <text x="170" y="528" class="node-sub" text-anchor="middle">format_audio_turn(transcript)</text>
  <text x="170" y="546" class="node-body" text-anchor="middle">Formulates prompt turn item:</text>
  <text x="170" y="564" class="node-sub" fill="#eb6c36" text-anchor="middle">source = 'spooler'</text>
  <text x="170" y="580" class="node-sub" text-anchor="middle">priority = Priority.NORMAL (4)</text>
  <text x="170" y="598" class="node-body" text-anchor="middle">Enqueues into TurnQueue</text>
  <text x="170" y="616" class="node-sub" text-anchor="middle">Moves processed audio to archive</text>
  <text x="170" y="632" class="node-body" text-anchor="middle">Audit trail preserved locally</text>

  <!-- ZONE 2 NODES: Signal Gateway & Security (Focal Box) -->
  <!-- Signal Mobile Client -->
  <rect x="348" y="128" width="424" height="68" rx="6" fill="#ffffff" stroke="#2e5aa8" stroke-width="1"/>
  <text x="360" y="148" class="node-name">Signal Mobile Client &amp; REST Container</text>
  <text x="360" y="168" class="node-sub">User Remote Phone • signal-cli-rest-api on localhost:8080</text>
  <text x="360" y="184" class="node-body">End-to-End Encrypted channel for mobile agent interaction</text>

  <!-- SignalClient Webhook Ingress -->
  <rect x="348" y="212" width="424" height="68" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1.2"/>
  <text x="360" y="232" class="node-name">POST /api/v1/signal/webhook Ingress</text>
  <text x="360" y="252" class="node-sub">SignalClient.handle_webhook(payload)</text>
  <text x="360" y="268" class="node-body">Extracts sender phone number, message text, and attachments</text>

  <!-- Whitelist Security Gate (Focal) -->
  <rect x="348" y="296" width="424" height="152" rx="6" fill="rgba(235, 108, 54, 0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="360" y="316" class="node-name-focal">Sender Whitelist Filter (Security Boundary)</text>
  <text x="360" y="336" class="node-sub">Config: SIGNAL_ALLOWED_SENDER • SIGNAL_ACCOUNT</text>
  <text x="360" y="356" class="node-body">• IF sender != SIGNAL_ALLOWED_SENDER:</text>
  <text x="360" y="374" class="node-body" fill="#ff8080">  → DROP message immediately! Log security warning. Zero leak.</text>
  <text x="360" y="394" class="node-body">• IF sender == SIGNAL_ALLOWED_SENDER:</text>
  <text x="360" y="412" class="node-sub" fill="#eb6c36">  → Store message in unread buffer. Formulate notification turn.</text>
  <text x="360" y="432" class="node-body">• Send typing indicator and read receipt to user device.</text>

  <!-- Notification Formulator -->
  <rect x="348" y="464" width="424" height="88" rx="6" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.2"/>
  <text x="360" y="484" class="node-name">Signal Notification Formulator</text>
  <text x="360" y="504" class="node-sub">Prompt: "📬 NEW Signal message received from {sender}."</text>
  <text x="360" y="522" class="node-body">Instructs main agent to call chat_mcp.get_next_unread_message()</text>
  <text x="360" y="538" class="node-sub" fill="#2e5aa8">source='signal' • priority=Priority.NORMAL (4)</text>

  <!-- Outbound Delivery Engine -->
  <rect x="348" y="568" width="424" height="172" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="360" y="588" class="node-name">Outbound Message &amp; Media Dispatcher</text>
  <text x="360" y="608" class="node-sub">SignalClient.send_message(recipient, text, attachments)</text>
  <text x="360" y="628" class="node-body">• POST /v2/send to signal-cli-rest-api.</text>
  <text x="360" y="646" class="node-body">• Base64 file attachment extraction for images, PDFs, logs.</text>
  <text x="360" y="666" class="node-sub" fill="#eb6c36">• Typing indicator stream while agent formulates response.</text>
  <text x="360" y="684" class="node-body">• Error retry and connection fallback handling.</text>
  <text x="360" y="702" class="node-sub" text-anchor="middle">Enables fully autonomous two-way mobile interaction</text>

  <!-- ZONE 3 NODES: TurnQueue Ingestion & Agent Flow -->
  <!-- TurnQueue Arbiter -->
  <rect x="844" y="128" width="292" height="128" rx="6" fill="rgba(235, 108, 54, 0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="990" y="152" class="node-name-focal" text-anchor="middle">TurnQueue Single Ingress</text>
  <text x="990" y="172" class="node-sub" text-anchor="middle">Unified Serialized Gateway</text>
  <text x="990" y="190" class="node-body" text-anchor="middle">Receives Signal &amp; Spooler Turns</text>
  <text x="990" y="206" class="node-body" text-anchor="middle">Sequential FIFO Resolution</text>
  <text x="990" y="222" class="node-sub" fill="#eb6c36" text-anchor="middle">Single Ingress Rule strictly upheld</text>
  <text x="990" y="238" class="node-body" text-anchor="middle">Zero race conditions</text>

  <!-- Main Agent RPC Execution -->
  <rect x="844" y="272" width="292" height="144" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1.2"/>
  <text x="990" y="296" class="node-name" text-anchor="middle">omp --mode rpc Agent</text>
  <text x="990" y="316" class="node-sub" text-anchor="middle">Profile: mypai • Model: llama.cpp/qwen3</text>
  <text x="990" y="334" class="node-body" text-anchor="middle">1. Receives notification turn</text>
  <text x="990" y="350" class="node-body" text-anchor="middle">2. Calls chat_mcp to read message</text>
  <text x="990" y="366" class="node-body" text-anchor="middle">3. Thinks and generates reply</text>
  <text x="990" y="384" class="node-sub" fill="#eb6c36" text-anchor="middle">4. Calls chat_mcp to send reply</text>
  <text x="990" y="400" class="node-body" text-anchor="middle">5. Concludes turn</text>

  <!-- chat_mcp Host Tools -->
  <rect x="844" y="432" width="292" height="144" rx="6" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.2"/>
  <text x="990" y="456" class="node-name" text-anchor="middle">chat_mcp Host Tools</text>
  <text x="990" y="476" class="node-sub" fill="#2e5aa8" text-anchor="middle">get_next_unread_message()</text>
  <text x="990" y="494" class="node-body" text-anchor="middle">Pops oldest unread message &amp; sender</text>
  <text x="990" y="512" class="node-sub" fill="#2e5aa8" text-anchor="middle">send_signal_message(to, text)</text>
  <text x="990" y="530" class="node-body" text-anchor="middle">Dispatches outbound response</text>
  <text x="990" y="548" class="node-sub" text-anchor="middle">list_signal_chats()</text>
  <text x="990" y="562" class="node-body" text-anchor="middle">Direct in-process bridge to SignalClient</text>

  <!-- Telemetry & History -->
  <rect x="844" y="592" width="292" height="148" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="990" y="616" class="node-name" text-anchor="middle">Audit Telemetry &amp; History</text>
  <text x="990" y="636" class="node-sub" text-anchor="middle">SQLite turn_history &amp; access logs</text>
  <text x="990" y="654" class="node-body" text-anchor="middle">Full auditable trace of mobile turns</text>
  <text x="990" y="672" class="node-body" text-anchor="middle">Delivery receipts and latency tracking</text>
  <text x="990" y="690" class="node-sub" text-anchor="middle">WebSocket event broadcast to WebUI</text>
  <text x="990" y="708" class="node-body" text-anchor="middle">Console displays mobile turn live</text>

  <!-- ==================== LEGEND STRIP ==================== -->
  <line x1="40" y1="784" x2="1160" y2="784" stroke="rgba(45, 49, 66, 0.12)" stroke-width="0.8"/>
  <text x="40" y="804" class="zone-eyebrow">LEGEND</text>
  
  <rect x="120" y="796" width="16" height="10" rx="2" fill="rgba(235, 108, 54, 0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="144" y="805" class="legend-text">Security Whitelist Guard &amp; Queue Ingress</text>

  <rect x="440" y="796" width="16" height="10" rx="2" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="464" y="805" class="legend-text">Core Audio / Agent Engine</text>

  <line x1="720" y1="801" x2="744" y2="801" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <text x="752" y="805" class="legend-text">Signal Webhook / MCP Call</text>

  <line x1="940" y1="801" x2="964" y2="801" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="972" y="805" class="legend-text">Agent Execution Dispatch</text>
</svg>
