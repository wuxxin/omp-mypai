<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');

      .bg-paper { fill: #faf7f2; }
      .zone-bg { fill: rgba(45, 49, 66, 0.02); stroke: rgba(45, 49, 66, 0.12); stroke-width: 0.8; }
      .zone-eyebrow { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #4f5d75; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }
      .title-main { font-family: 'Instrument Serif', serif; font-size: 26px; fill: #1c1917; }
      .subtitle { font-family: 'Geist', sans-serif; font-size: 11px; fill: #4f5d75; }
      .header-tag { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #eb6c36; letter-spacing: 0.14em; font-weight: 600; }

      .node-name { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; fill: #1c1917; }
      .node-name-focal { font-family: 'Geist', sans-serif; font-size: 13px; font-weight: 700; fill: #eb6c36; }
      .node-sub { font-family: 'Geist Mono', monospace; font-size: 8.5px; fill: #4f5d75; }
      .node-body { font-family: 'Geist', sans-serif; font-size: 9.5px; fill: #334155; }
      .tag-text { font-family: 'Geist Mono', monospace; font-size: 7px; letter-spacing: 0.08em; font-weight: 600; }
      
      .conn-label { font-family: 'Geist Mono', monospace; font-size: 7.5px; letter-spacing: 0.08em; font-weight: 600; }
      .legend-text { font-family: 'Geist Mono', monospace; font-size: 8.5px; fill: #4f5d75; }
    </style>

    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>

  <rect width="1200" height="840" class="bg-paper"/>

  <!-- ==================== HEADER ==================== -->
  <text x="40" y="28" class="header-tag">10,000-FT MACRO ARCHITECTURE</text>
  <text x="40" y="56" class="title-main">myPAI Ecosystem &amp; Multi-Profile Runtime</text>
  <text x="40" y="76" class="subtitle">Host sandbox boundary, local LLM inference, dual-profile Oh-My-Pi framework, daemon coordinator, and multi-workspace agents</text>

  <!-- ==================== ZONES ==================== -->
  <!-- Zone 1: Host & Profile Infrastructure -->
  <rect x="40" y="96" width="260" height="664" rx="8" class="zone-bg"/>
  <rect x="52" y="100" width="220" height="12" rx="2" fill="#faf7f2"/>
  <text x="56" y="109" class="zone-eyebrow">1. HOST &amp; RUNTIME PROFILES</text>

  <!-- Zone 2: Daemon Coordinator (Focal) -->
  <rect x="324" y="96" width="472" height="664" rx="8" class="zone-bg" stroke="rgba(235, 108, 54, 0.25)" stroke-width="1"/>
  <rect x="336" y="100" width="340" height="12" rx="2" fill="#faf7f2"/>
  <text x="340" y="109" class="zone-eyebrow" fill="#eb6c36">2. myPAI DAEMON COORDINATOR (PORT 52080)</text>

  <!-- Zone 3: Human Interfaces & External Agents -->
  <rect x="820" y="96" width="340" height="664" rx="8" class="zone-bg"/>
  <rect x="832" y="100" width="280" height="12" rx="2" fill="#faf7f2"/>
  <text x="836" y="109" class="zone-eyebrow">3. INTERFACES &amp; EXTERNAL WORKERS</text>

  <!-- ==================== CONNECTORS ==================== -->
  <!-- LLM -> Daemon Session -->
  <path d="M 276 256 L 348 256" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="284" y="242" width="56" height="12" rx="2" fill="#faf7f2"/>
  <text x="312" y="251" class="conn-label" fill="#eb6c36" text-anchor="middle">TOKENS</text>

  <!-- Profile Config -> Daemon Session -->
  <path d="M 276 564 L 348 564" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="284" y="550" width="56" height="12" rx="2" fill="#faf7f2"/>
  <text x="312" y="559" class="conn-label" fill="#4f5d75" text-anchor="middle">PROFILE</text>

  <!-- Interfaces -> TurnQueue -->
  <path d="M 844 200 L 772 200" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="780" y="186" width="56" height="12" rx="2" fill="#faf7f2"/>
  <text x="808" y="195" class="conn-label" fill="#2e5aa8" text-anchor="middle">ENQUEUE</text>

  <!-- Daemon -> WebUI Stream -->
  <path d="M 772 320 L 844 320" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="780" y="306" width="56" height="12" rx="2" fill="#faf7f2"/>
  <text x="808" y="315" class="conn-label" fill="#2e5aa8" text-anchor="middle">WS STREAM</text>

  <!-- ACP Manager -> External Workers -->
  <path d="M 772 580 L 844 580" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="780" y="566" width="56" height="12" rx="2" fill="#faf7f2"/>
  <text x="808" y="575" class="conn-label" fill="#eb6c36" text-anchor="middle">DELEGATE</text>

  <!-- ACP Callback -> TurnQueue -->
  <path d="M 844 680 L 808 680 A 8 8 0 0 1 800 672 L 800 248 A 8 8 0 0 0 792 240 L 772 240" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="752" y="440" width="96" height="12" rx="2" fill="#faf7f2"/>
  <text x="800" y="449" class="conn-label" fill="#eb6c36" text-anchor="middle">CALLBACK (P2)</text>

  <!-- ==================== NODES ==================== -->

  <!-- ZONE 1 NODES: Host & Profile Infrastructure -->
  <!-- Sandbox -->
  <rect x="64" y="128" width="212" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="76" y="146" class="tag-text" fill="#4f5d75">SANDBOX</text>
  <text x="170" y="156" class="node-name" text-anchor="middle">Bubblewrap (bwrap)</text>
  <text x="170" y="174" class="node-sub" text-anchor="middle">Linux Namespace Isolation</text>
  <text x="170" y="190" class="node-body" text-anchor="middle">Systemd socket discipline &amp; safety</text>

  <!-- LLM Runtime -->
  <rect x="64" y="220" width="212" height="92" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1.2"/>
  <text x="76" y="238" class="tag-text" fill="#1c1917">INFERENCE</text>
  <text x="170" y="248" class="node-name" text-anchor="middle">Local LLM Engine</text>
  <text x="170" y="268" class="node-sub" text-anchor="middle">llama.cpp server / Qwen3-32B</text>
  <text x="170" y="284" class="node-body" text-anchor="middle">Configured via models.yml</text>
  <text x="170" y="300" class="node-sub" text-anchor="middle">High throughput &amp; zero leak</text>

  <!-- Base Oh-My-Pi Profile -->
  <rect x="64" y="332" width="212" height="116" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="76" y="350" class="tag-text" fill="#4f5d75">BASE PROFILE</text>
  <text x="170" y="360" class="node-name" text-anchor="middle">~/.omp/agent/ (oh-my-pi)</text>
  <text x="170" y="380" class="node-sub" text-anchor="middle">bankId: oh-my-pi</text>
  <text x="170" y="396" class="node-body" text-anchor="middle">Core framework skills &amp; base tools</text>
  <text x="170" y="412" class="node-sub" fill="#eb6c36" text-anchor="middle">Default target for ACP Workers</text>
  <text x="170" y="428" class="node-body" text-anchor="middle">Never contaminated by profile state</text>

  <!-- MyPai Profile -->
  <rect x="64" y="468" width="212" height="132" rx="6" fill="rgba(235, 108, 54, 0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="76" y="486" class="tag-text" fill="#eb6c36">MYPAI PROFILE</text>
  <text x="170" y="496" class="node-name-focal" text-anchor="middle">~/.omp/profiles/mypai/agent/</text>
  <text x="170" y="516" class="node-sub" text-anchor="middle">bankId: mypai • x-client-id: mypai</text>
  <text x="170" y="534" class="node-body" text-anchor="middle">mypai.yaml • developer-profile.yaml</text>
  <text x="170" y="550" class="node-body" text-anchor="middle">mypai-knowledge.yaml memory banks</text>
  <text x="170" y="568" class="node-sub" text-anchor="middle">Autonomous Developer Personality</text>
  <text x="170" y="584" class="node-body" text-anchor="middle">Persistent session driver target</text>

  <!-- Host Tools Layer -->
  <rect x="64" y="620" width="212" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="76" y="638" class="tag-text" fill="#4f5d75">IN-PROCESS</text>
  <text x="170" y="648" class="node-name" text-anchor="middle">Native Host Tools</text>
  <text x="170" y="668" class="node-sub" text-anchor="middle">Injected via set_custom_tools()</text>
  <text x="170" y="686" class="node-body" text-anchor="middle">Cron Host Tools (CRUD &amp; Run)</text>
  <text x="170" y="702" class="node-sub" fill="#eb6c36" text-anchor="middle">ACP Host Tools (Async Workers)</text>
  <text x="170" y="720" class="node-body" text-anchor="middle">Direct SQLite &amp; pool integration</text>

  <!-- ZONE 2 NODES: Daemon Coordinator (Focal Box) -->
  <!-- TurnQueue Arbiter -->
  <rect x="348" y="128" width="424" height="144" rx="6" fill="rgba(235, 108, 54, 0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="360" y="148" class="node-name-focal">TurnQueue Priority State Machine</text>
  <text x="360" y="168" class="node-sub">Single Ingress Rule: All turns must enqueue here first</text>
  <text x="360" y="188" class="node-body">• Priority 0: Abort &amp; Flush Queue | Priority 1: Steer Interrupt</text>
  <text x="360" y="206" class="node-body">• Priority 2: ACP &amp; System Event Callbacks</text>
  <text x="360" y="224" class="node-body">• Priority 3: Followup Messages | Priority 4: User &amp; Cron Prompts</text>
  <text x="360" y="244" class="node-sub" fill="#eb6c36">• Single Consumer Worker: queue_worker_loop dequeues sequentially</text>
  <text x="360" y="262" class="node-body">• Instant 200/202 Response with task_id to all callers</text>

  <!-- OMPSessionManager & Persistent Session -->
  <rect x="348" y="292" width="424" height="144" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1.2"/>
  <text x="360" y="312" class="node-name">OMPSessionManager (RPC Driver)</text>
  <text x="360" y="332" class="node-sub">Persistent Process Supervisor &amp; Telemetry Provider</text>
  <text x="360" y="352" class="node-body">• Spawns: omp --mode rpc --profile mypai in workspace</text>
  <text x="360" y="370" class="node-body">• execute_turn() is strictly private to queue_worker_loop</text>
  <text x="360" y="388" class="node-body">• Controls token streaming, connection triage, and reattachment</text>
  <text x="360" y="408" class="node-sub" fill="#eb6c36">• Reattaches to persistent session_uuid stored in SQLite DB</text>
  <text x="360" y="426" class="node-body">• Title: "mypai_daemon - running" (Visible in OMP CLI)</text>

  <!-- CronScheduler Core -->
  <rect x="348" y="456" width="424" height="136" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="360" y="476" class="node-name">CronScheduler &amp; Concurrency Registry</text>
  <text x="360" y="496" class="node-sub">Tier 1 Parallel Background Execution Plane</text>
  <text x="360" y="516" class="node-body">• APScheduler Core synchronized with SQLite cron_jobs table</text>
  <text x="360" y="534" class="node-body">• running_jobs registry prevents overlapping concurrent executions</text>
  <text x="360" y="552" class="node-body">• Parallel non-blocking execution: Shell, HTTP, Python, ACP</text>
  <text x="360" y="572" class="node-sub" fill="#eb6c36">• Evaluates macros (#[_RESULT]) and enqueues result turns to TurnQueue</text>

  <!-- ACP Delegation Manager -->
  <rect x="348" y="612" width="424" height="128" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
  <text x="360" y="632" class="node-name-focal">AcpDelegationManager (Worker Process Pool)</text>
  <text x="360" y="652" class="node-sub">Subprocess Pool across Workspace Directories</text>
  <text x="360" y="672" class="node-body">• Auto-attaches initial worker to $MYPAI_AGENT_DIR on startup</text>
  <text x="360" y="690" class="node-body">• Spawns omp --mode acp --profile &lt;default&gt; (Base tools)</text>
  <text x="360" y="708" class="node-sub" fill="#eb6c36">• Enqueues automatic completion callback to TurnQueue (Priority 2)</text>
  <text x="360" y="726" class="node-body">• Live status streaming to WebUI Team Sidecar</text>

  <!-- ZONE 3 NODES: Human Interfaces & External Agents -->
  <!-- WebUI Console -->
  <rect x="844" y="128" width="292" height="128" rx="6" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.2"/>
  <text x="990" y="150" class="node-name" text-anchor="middle">WebUI Single-Page Console</text>
  <text x="990" y="168" class="node-sub" text-anchor="middle">Port 52080 • Vanilla HTML5/CSS/JS</text>
  <text x="990" y="186" class="node-body" text-anchor="middle">Glowing Header: IDLE / ACTIVE / STREAMING</text>
  <text x="990" y="202" class="node-body" text-anchor="middle">Realtime Token Streaming &amp; RPC Console</text>
  <text x="990" y="218" class="node-sub" text-anchor="middle">3 Sidebars: Sessions, Cron (2-row), Team</text>
  <text x="990" y="234" class="node-body" text-anchor="middle">Task Output Viewer overlay with Esc restore</text>

  <!-- Signal Gateway -->
  <rect x="844" y="272" width="292" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="990" y="294" class="node-name" text-anchor="middle">Signal Messaging Gateway</text>
  <text x="990" y="312" class="node-sub" text-anchor="middle">Remote Access &amp; Notifications</text>
  <text x="990" y="330" class="node-body" text-anchor="middle">signal-cli-rest-api webhook listener</text>
  <text x="990" y="346" class="node-sub" text-anchor="middle">Whitelist filter • chat_mcp agent tool</text>

  <!-- Input Spooler -->
  <rect x="844" y="384" width="292" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="990" y="406" class="node-name" text-anchor="middle">Input Spooler Subsystem</text>
  <text x="990" y="424" class="node-sub" text-anchor="middle">Multi-Modal Audio &amp; Inbox Ingress</text>
  <text x="990" y="442" class="node-body" text-anchor="middle">Whisper Speech-to-Text Transcriber</text>
  <text x="990" y="458" class="node-sub" text-anchor="middle">Hindsight memory context injection</text>

  <!-- Multi-Workspace ACP Workers -->
  <rect x="844" y="496" width="292" height="144" rx="6" fill="rgba(235, 108, 54, 0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="990" y="520" class="node-name-focal" text-anchor="middle">Multi-Workspace ACP Workers</text>
  <text x="990" y="540" class="node-sub" text-anchor="middle">External Subagent Execution Pool</text>
  <text x="990" y="558" class="node-body" text-anchor="middle">1. Workspace Root ($MYPAI_AGENT_DIR)</text>
  <text x="990" y="574" class="node-body" text-anchor="middle">2. External Repo A (/path/to/project-a)</text>
  <text x="990" y="590" class="node-body" text-anchor="middle">3. External Repo B (/path/to/project-b)</text>
  <text x="990" y="608" class="node-sub" fill="#eb6c36" text-anchor="middle">Profile: default (Runs in base Oh-My-Pi)</text>
  <text x="990" y="624" class="node-body" text-anchor="middle">Parallel async background workers</text>

  <!-- SQLite Database Storage -->
  <rect x="844" y="656" width="292" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="990" y="678" class="node-name" text-anchor="middle">SQLite WAL Database</text>
  <text x="990" y="698" class="node-sub" text-anchor="middle">agent-{basedir}-{hash}.db</text>
  <text x="990" y="716" class="node-body" text-anchor="middle">cron_jobs • settings • turn_history</text>
  <text x="990" y="730" class="node-sub" text-anchor="middle">Multi-workspace directory partitioning</text>

  <!-- ==================== LEGEND STRIP ==================== -->
  <line x1="40" y1="784" x2="1160" y2="784" stroke="rgba(45, 49, 66, 0.12)" stroke-width="0.8"/>
  <text x="40" y="804" class="zone-eyebrow">LEGEND</text>
  
  <rect x="120" y="796" width="16" height="10" rx="2" fill="rgba(235, 108, 54, 0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="144" y="805" class="legend-text">MyPai Persona / Priority Queue / ACP</text>

  <rect x="440" y="796" width="16" height="10" rx="2" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="464" y="805" class="legend-text">Daemon Coordinator / Subprocess</text>

  <rect x="700" y="796" width="16" height="10" rx="2" fill="#ffffff" stroke="#2e5aa8" stroke-width="1"/>
  <text x="724" y="805" class="legend-text">WebUI / Ingress Streams</text>

  <line x1="920" y1="801" x2="944" y2="801" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="952" y="805" class="legend-text">Execution &amp; Async Callback</text>
</svg>
