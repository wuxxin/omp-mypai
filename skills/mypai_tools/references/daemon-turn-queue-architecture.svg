<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');

      .bg-paper { fill: #faf7f2; }
      .zone-bg { fill: rgba(45, 49, 66, 0.02); stroke: rgba(45, 49, 66, 0.12); stroke-width: 0.8; }
      .zone-eyebrow { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #4f5d75; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }
      .title-main { font-family: 'Instrument Serif', serif; font-size: 26px; fill: #1c1917; }
      .subtitle { font-family: 'Geist', sans-serif; font-size: 11px; fill: #4f5d75; }
      .header-tag { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #eb6c36; letter-spacing: 0.14em; font-weight: 600; }

      .node-name { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; fill: #1c1917; }
      .node-name-focal { font-family: 'Geist', sans-serif; font-size: 13px; font-weight: 700; fill: #eb6c36; }
      .node-sub { font-family: 'Geist Mono', monospace; font-size: 8.5px; fill: #4f5d75; }
      .node-body { font-family: 'Geist', sans-serif; font-size: 9.5px; fill: #334155; }
      .tag-text { font-family: 'Geist Mono', monospace; font-size: 7px; letter-spacing: 0.08em; font-weight: 600; }
      
      .conn-label { font-family: 'Geist Mono', monospace; font-size: 7.5px; letter-spacing: 0.08em; font-weight: 600; }
      .legend-text { font-family: 'Geist Mono', monospace; font-size: 8.5px; fill: #4f5d75; }
    </style>

    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>

  <rect width="1200" height="840" class="bg-paper"/>

  <!-- ==================== HEADER ==================== -->
  <text x="40" y="28" class="header-tag">SUBLEVEL ARCHITECTURE: TURN QUEUE &amp; PRIORITY ENGINE</text>
  <text x="40" y="56" class="title-main">myPAI TurnQueue Priority State Machine</text>
  <text x="40" y="76" class="subtitle">Unified ingress buffer, 5-level priority resolution, and single-consumer execution pipeline</text>

  <!-- ==================== ZONES ==================== -->
  <!-- Zone 1: Ingress Sources -->
  <rect x="40" y="96" width="260" height="664" rx="8" class="zone-bg"/>
  <rect x="52" y="100" width="180" height="12" rx="2" fill="#faf7f2"/>
  <text x="56" y="109" class="zone-eyebrow">1. INGRESS PRODUCERS</text>

  <!-- Zone 2: Priority Queue Arbiter (Focal) -->
  <rect x="324" y="96" width="472" height="664" rx="8" class="zone-bg" stroke="rgba(235, 108, 54, 0.25)" stroke-width="1"/>
  <rect x="336" y="100" width="340" height="12" rx="2" fill="#faf7f2"/>
  <text x="340" y="109" class="zone-eyebrow" fill="#eb6c36">2. TURNQUEUE 5-PRIORITY STATE MACHINE</text>

  <!-- Zone 3: Execution Pipeline -->
  <rect x="820" y="96" width="340" height="664" rx="8" class="zone-bg"/>
  <rect x="832" y="100" width="260" height="12" rx="2" fill="#faf7f2"/>
  <text x="836" y="109" class="zone-eyebrow">3. EXECUTION PIPELINE</text>

  <!-- ==================== CONNECTORS ==================== -->
  <!-- Instant Abort Ingress -->
  <path d="M 276 156 L 348 156" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
  <rect x="284" y="142" width="56" height="12" rx="2" fill="#faf7f2"/>
  <text x="312" y="151" class="conn-label" fill="#eb6c36" text-anchor="middle">PURGE ALL</text>

  <!-- Steer Ingress -->
  <path d="M 276 244 L 348 244" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="284" y="230" width="56" height="12" rx="2" fill="#faf7f2"/>
  <text x="312" y="239" class="conn-label" fill="#eb6c36" text-anchor="middle">STEER P1</text>

  <!-- ACP Callback Ingress -->
  <path d="M 276 332 L 348 332" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="284" y="318" width="56" height="12" rx="2" fill="#faf7f2"/>
  <text x="312" y="327" class="conn-label" fill="#eb6c36" text-anchor="middle">EVENT P2</text>

  <!-- Followup Ingress -->
  <path d="M 276 420 L 348 420" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="284" y="406" width="56" height="12" rx="2" fill="#faf7f2"/>
  <text x="312" y="415" class="conn-label" fill="#4f5d75" text-anchor="middle">APPEND P3</text>

  <!-- User / Signal / Cron Ingress -->
  <path d="M 276 508 L 348 508" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="284" y="494" width="56" height="12" rx="2" fill="#faf7f2"/>
  <text x="312" y="503" class="conn-label" fill="#2e5aa8" text-anchor="middle">PROMPT P4</text>

  <!-- Queue -> Worker Loop -->
  <path d="M 772 400 L 844 400" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="780" y="386" width="56" height="12" rx="2" fill="#faf7f2"/>
  <text x="808" y="395" class="conn-label" fill="#eb6c36" text-anchor="middle">GET_NEXT</text>

  <!-- Worker Loop -> Session Manager -->
  <path d="M 990 448 L 990 492" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="948" y="462" width="84" height="12" rx="2" fill="#faf7f2"/>
  <text x="990" y="471" class="conn-label" fill="#eb6c36" text-anchor="middle">EXECUTE_TURN</text>

  <!-- Session Manager -> RpcClient -->
  <path d="M 990 572 L 990 616" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ==================== NODES ==================== -->

  <!-- ZONE 1 NODES: Ingress -->
  <!-- Instant Abort -->
  <rect x="64" y="128" width="212" height="60" rx="6" fill="rgba(235, 108, 54, 0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="76" y="146" class="tag-text" fill="#eb6c36">PRIORITY 0</text>
  <text x="170" y="156" class="node-name-focal" text-anchor="middle">POST /session/abort</text>
  <text x="170" y="174" class="node-sub" text-anchor="middle">Instant Control-Plane Purge</text>

  <!-- Steer Request -->
  <rect x="64" y="216" width="212" height="60" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
  <text x="76" y="234" class="tag-text" fill="#eb6c36">PRIORITY 1</text>
  <text x="170" y="244" class="node-name" text-anchor="middle">POST /session/steer</text>
  <text x="170" y="262" class="node-sub" text-anchor="middle">Live Turn Steering Guidance</text>

  <!-- ACP Callback -->
  <rect x="64" y="304" width="212" height="60" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
  <text x="76" y="322" class="tag-text" fill="#eb6c36">PRIORITY 2</text>
  <text x="170" y="332" class="node-name" text-anchor="middle">ACP Subagent Callback</text>
  <text x="170" y="350" class="node-sub" text-anchor="middle">Completed / Failed Results</text>

  <!-- Followup Request -->
  <rect x="64" y="392" width="212" height="60" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="76" y="410" class="tag-text" fill="#4f5d75">PRIORITY 3</text>
  <text x="170" y="420" class="node-name" text-anchor="middle">POST /session/followup</text>
  <text x="170" y="438" class="node-sub" text-anchor="middle">Append Context to Active Turn</text>

  <!-- Standard Prompts -->
  <rect x="64" y="480" width="212" height="76" rx="6" fill="#ffffff" stroke="#2e5aa8" stroke-width="1"/>
  <text x="76" y="498" class="tag-text" fill="#2e5aa8">PRIORITY 4</text>
  <text x="170" y="508" class="node-name" text-anchor="middle">User / Signal / Cron</text>
  <text x="170" y="526" class="node-sub" text-anchor="middle">POST /prompt • Signal Webhook</text>
  <text x="170" y="542" class="node-sub" text-anchor="middle">Cron OMP Tasks • Spooler Audio</text>

  <!-- Return Immediate Task ID box -->
  <rect x="64" y="584" width="212" height="68" rx="6" fill="#ffffff" stroke="rgba(45, 49, 66, 0.12)" stroke-width="1"/>
  <text x="170" y="606" class="node-name" text-anchor="middle">Instant 200/202 Response</text>
  <text x="170" y="624" class="node-sub" fill="#2e5aa8" text-anchor="middle">{"status": "queued", "task_id": "..."}</text>
  <text x="170" y="640" class="node-body" text-anchor="middle">Zero caller latency (&lt; 5ms)</text>

  <!-- ZONE 2 NODES: Priority State Machine (Focal Box) -->
  <!-- Level 0 Box -->
  <rect x="348" y="128" width="424" height="76" rx="6" fill="rgba(235, 108, 54, 0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="360" y="146" class="node-name-focal">Priority 0: Abort / Abort &amp; Prompt (Emergency Interrupt)</text>
  <text x="360" y="166" class="node-sub">Action: Instantly flush/purge all pending queue items.</text>
  <text x="360" y="184" class="node-body">Signals RpcClient.abort() immediately. If prompt included, injects as new clean turn.</text>

  <!-- Level 1 Box -->
  <rect x="348" y="216" width="424" height="76" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
  <text x="360" y="234" class="node-name-focal">Priority 1: Steer Guidance Interrupt</text>
  <text x="360" y="254" class="node-sub">Condition: Turn currently active/streaming on RpcClient.</text>
  <text x="360" y="272" class="node-body">Pops oldest FIFO steer item. Dispatches RpcClient.steer(prompt) without breaking turn.</text>

  <!-- Level 2 Box -->
  <rect x="348" y="304" width="424" height="76" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
  <text x="360" y="322" class="node-name-focal">Priority 2: ACP &amp; System Event Callbacks</text>
  <text x="360" y="342" class="node-sub">Condition: Background ACP subagent worker completed or failed.</text>
  <text x="360" y="360" class="node-body">Pops oldest callback. Automatically injects result into main agent context.</text>

  <!-- Level 3 Box -->
  <rect x="348" y="392" width="424" height="76" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="360" y="410" class="node-name">Priority 3: Followup Turn Messages</text>
  <text x="360" y="430" class="node-sub">Condition: User adds follow-up instruction to active session.</text>
  <text x="360" y="448" class="node-body">Pops oldest FIFO followup item. Dispatches RpcClient.follow_up(prompt).</text>

  <!-- Level 4 Box -->
  <rect x="348" y="480" width="424" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="360" y="498" class="node-name">Priority 4: User Prompts &amp; Scheduled Cron Turns</text>
  <text x="360" y="518" class="node-sub">Condition: Main Agent is IDLE (is_session_busy == False).</text>
  <text x="360" y="536" class="node-body">Pops oldest FIFO prompt. Dispatches clean prompt turn to RpcClient.</text>

  <!-- State Machine Rules Summary -->
  <rect x="348" y="572" width="424" height="168" rx="6" fill="#ffffff" stroke="rgba(45, 49, 66, 0.12)" stroke-width="1"/>
  <text x="360" y="592" class="node-name">TurnQueue Arbiter Internal State</text>
  <text x="360" y="612" class="node-sub">_items: list[dict] • _history: list[dict] • _lock: asyncio.Lock()</text>
  <text x="360" y="632" class="node-body">• get_next() iterates priority 0 → 4 in strict order.</text>
  <text x="360" y="650" class="node-body">• Blocks asynchronously if queue is empty or active turn is busy.</text>
  <text x="360" y="668" class="node-body">• Guarantees zero race conditions across multi-producer callers.</text>
  <text x="360" y="688" class="node-sub" fill="#eb6c36">• Single Ingress Rule: No caller bypasses TurnQueue.</text>
  <text x="360" y="708" class="node-sub" fill="#4f5d75">• Single Consumer: Only queue_worker_loop dequeues and executes.</text>

  <!-- ZONE 3 NODES: Execution Pipeline -->
  <!-- queue_worker_loop -->
  <rect x="844" y="128" width="292" height="120" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1.2"/>
  <rect x="856" y="136" width="56" height="12" rx="2" fill="transparent" stroke="#1c1917" stroke-width="0.8"/>
  <text x="884" y="145" class="tag-text" fill="#1c1917" text-anchor="middle">CONSUMER</text>
  <text x="990" y="156" class="node-name" text-anchor="middle">queue_worker_loop</text>
  <text x="990" y="174" class="node-sub" text-anchor="middle">Async Daemon Background Coroutine</text>
  <text x="990" y="192" class="node-body" text-anchor="middle">1. item = await queue.get_next()</text>
  <text x="990" y="208" class="node-body" text-anchor="middle">2. session_mgr.triage_connection()</text>
  <text x="990" y="224" class="node-body" text-anchor="middle">3. res = await session_mgr.execute_turn(item)</text>
  <text x="990" y="240" class="node-sub" text-anchor="middle">4. queue.mark_completed(task_id, res)</text>

  <!-- OMPSessionManager -->
  <rect x="844" y="272" width="292" height="96" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="990" y="296" class="node-name" text-anchor="middle">OMPSessionManager</text>
  <text x="990" y="316" class="node-sub" text-anchor="middle">Private execute_turn() Entry Point</text>
  <text x="990" y="334" class="node-body" text-anchor="middle">Wraps RpcClient.prompt/steer/followup</text>
  <text x="990" y="352" class="node-sub" text-anchor="middle">UUID reattach • Triage • Telemetry</text>

  <!-- RpcClient Child Process -->
  <rect x="844" y="392" width="292" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="990" y="416" class="node-name" text-anchor="middle">omp --mode rpc Process</text>
  <text x="990" y="436" class="node-sub" text-anchor="middle">Profile: mypai • Model: llama.cpp/qwen3</text>
  <text x="990" y="454" class="node-body" text-anchor="middle">JSON-RPC Stdout/Stdin Pipe</text>
  <text x="990" y="472" class="node-sub" text-anchor="middle">Event Tapping &amp; Streaming</text>

  <!-- Realtime Output Broadcast -->
  <rect x="844" y="512" width="292" height="116" rx="6" fill="#ffffff" stroke="#2e5aa8" stroke-width="1"/>
  <text x="990" y="536" class="node-name" text-anchor="middle">WebSocket Broadcast Stream</text>
  <text x="990" y="556" class="node-sub" fill="#2e5aa8" text-anchor="middle">turn_queued • turn_started</text>
  <text x="990" y="574" class="node-sub" fill="#eb6c36" text-anchor="middle">message_update (Token Stream)</text>
  <text x="990" y="592" class="node-sub" fill="#2e5aa8" text-anchor="middle">turn_completed • turn_aborted</text>
  <text x="990" y="610" class="node-body" text-anchor="middle">Zero-polling real-time updates</text>

  <!-- SQLite Turn History -->
  <rect x="844" y="652" width="292" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="990" y="674" class="node-name" text-anchor="middle">SQLite History &amp; Telemetry</text>
  <text x="990" y="694" class="node-sub" text-anchor="middle">Table: turn_history • queue.history</text>
  <text x="990" y="712" class="node-body" text-anchor="middle">Duration, prompt, output, error, exitcode</text>
  <text x="990" y="728" class="node-sub" text-anchor="middle">Auditable execution lineage</text>

  <!-- ==================== LEGEND STRIP ==================== -->
  <line x1="40" y1="784" x2="1160" y2="784" stroke="rgba(45, 49, 66, 0.12)" stroke-width="0.8"/>
  <text x="40" y="804" class="zone-eyebrow">LEGEND</text>
  
  <rect x="120" y="796" width="16" height="10" rx="2" fill="rgba(235, 108, 54, 0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="144" y="805" class="legend-text">Priority 0-2 (Urgent Interrupt &amp; Callbacks)</text>

  <rect x="420" y="796" width="16" height="10" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="444" y="805" class="legend-text">Priority 3-4 (Normal Prompts &amp; Followups)</text>

  <line x1="720" y1="801" x2="744" y2="801" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="752" y="805" class="legend-text">Priority Resolution Dispatch</text>

  <line x1="940" y1="801" x2="964" y2="801" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <text x="972" y="805" class="legend-text">Client Enqueue / Streaming</text>
</svg>
