<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 580" width="840" height="580" style="max-width: 100%; height: auto;">
  <defs>
    <!-- Card & Glow Filters -->
    <filter id="card-shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <filter id="accent-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#b5523a" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Outer Background -->
  <rect width="840" height="580" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1"/>

  <!-- ==================== MAIN GLASS WINDOW CONTAINER ==================== -->
  <rect x="20" y="20" width="800" height="540" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#card-shadow)"/>

  <!-- ==================== HEADER BAR ==================== -->
  <path d="M 20 30 A 10 10 0 0 1 30 20 L 810 20 A 10 10 0 0 1 820 30 L 820 65 L 20 65 Z" fill="#1e293b"/>
  <line x1="20" y1="65" x2="820" y2="65" stroke="#334155" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="40" cy="42" r="5" fill="#ef4444"/>
  <circle cx="56" cy="42" r="5" fill="#f59e0b"/>
  <circle cx="72" cy="42" r="5" fill="#22c55e"/>

  <!-- Title & Logo -->
  <text x="96" y="46" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" letter-spacing="-0.01em">MyPAI Dashboard</text>
  <rect x="225" y="32" width="105" height="20" rx="10" fill="rgba(34, 197, 94, 0.15)" stroke="rgba(34, 197, 94, 0.3)" stroke-width="1"/>
  <circle cx="237" cy="42" r="3.5" fill="#22c55e"/>
  <text x="246" y="46" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#4ade80">CONNECTED</text>

  <!-- Header Right Telemetry -->
  <text x="800" y="46" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="end">PID: 12345  ·  ~/mypai  ·  Uptime: 01:23:45</text>

  <!-- ==================== SECTION 1: TRANSCRIPT STREAM ==================== -->
  <g filter="url(#card-shadow)">
    <!-- Container -->
    <rect x="35" y="80" width="770" height="215" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Sub-header -->
    <rect x="35" y="80" width="770" height="28" rx="8" fill="#0f172a"/>
    <path d="M 35 108 L 805 108" stroke="#1e293b" stroke-width="1"/>
    <text x="48" y="98" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.8">LIVE SESSION TRANSCRIPT &amp; LOG STREAM (WS /api/v1/ws)</text>
    
    <!-- Auto-scroll pill -->
    <rect x="700" y="86" width="95" height="16" rx="4" fill="rgba(14, 165, 233, 0.15)"/>
    <text x="747" y="97" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#38bdf8" text-anchor="middle">AUTO-SCROLL ON</text>

    <!-- Terminal Lines -->
    <!-- Line 1 -->
    <text x="50" y="128" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#64748b">[12:34:01]</text>
    <rect x="115" y="117" width="45" height="15" rx="3" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="137" y="128" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle">SYSTEM</text>
    <text x="170" y="128" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#e2e8f0">RPC Client connected to session <tspan fill="#38bdf8">'mypai-main'</tspan> in /home/wuxxin/mypai</text>

    <!-- Line 2 -->
    <text x="50" y="152" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#64748b">[12:34:05]</text>
    <rect x="115" y="141" width="45" height="15" rx="3" fill="rgba(168, 85, 247, 0.15)"/>
    <text x="137" y="152" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" font-weight="700" fill="#c084fc" text-anchor="middle">SIGNAL</text>
    <text x="170" y="152" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#e2e8f0">Incoming prompt turn from authorized sender <tspan fill="#c084fc">+15559992222</tspan></text>

    <!-- Line 3 -->
    <text x="50" y="176" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#64748b">[12:34:06]</text>
    <rect x="115" y="165" width="45" height="15" rx="3" fill="rgba(245, 158, 11, 0.15)"/>
    <text x="137" y="176" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" font-weight="700" fill="#fbbf24" text-anchor="middle">QUEUE</text>
    <text x="170" y="176" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#e2e8f0">Turn enqueued with priority <tspan fill="#fbbf24">P2 (Signal/Interactive)</tspan> — dispatching to RPC client</text>

    <!-- Line 4 -->
    <text x="50" y="200" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#64748b">[12:34:08]</text>
    <rect x="115" y="189" width="45" height="15" rx="3" fill="rgba(34, 197, 94, 0.15)"/>
    <text x="137" y="200" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" font-weight="700" fill="#4ade80" text-anchor="middle">AGENT</text>
    <text x="170" y="200" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#e2e8f0">Executing tool call <tspan fill="#4ade80">'chat_mcp.get_next_unread_message'</tspan>...</text>

    <!-- Line 5 (Streaming Cursor) -->
    <text x="50" y="224" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#64748b">[12:34:10]</text>
    <rect x="115" y="213" width="45" height="15" rx="3" fill="rgba(181, 82, 58, 0.2)"/>
    <text x="137" y="224" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" font-weight="700" fill="#b5523a" text-anchor="middle">STREAM</text>
    <text x="170" y="224" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#f8fafc">"Processing user request and finalizing system telemetry..."</text>
    <rect x="585" y="213" width="7" height="14" fill="#b5523a" filter="url(#accent-glow)"/>
  </g>

  <!-- ==================== SECTION 2: INTERACTIVE CONTROL LINE ==================== -->
  <g filter="url(#card-shadow)">
    <!-- Container -->
    <rect x="35" y="310" width="770" height="105" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    
    <!-- Text Input Box -->
    <rect x="50" y="325" width="740" height="42" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="65" y="350" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Type a prompt or steer command to send to active OMP session...</text>
    
    <!-- Mode Radio Selector & Submit Button -->
    <!-- Mode label -->
    <text x="50" y="393" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Mode:</text>
    
    <!-- Prompt Option (Active) -->
    <rect x="95" y="380" width="85" height="22" rx="11" fill="#b5523a"/>
    <circle cx="107" cy="391" r="4" fill="#ffffff"/>
    <text x="117" y="395" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Prompt</text>

    <!-- Steer Option (Inactive) -->
    <rect x="190" y="380" width="75" height="22" rx="11" fill="#334155"/>
    <circle cx="202" cy="391" r="4" fill="#64748b"/>
    <text x="212" y="395" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#cbd5e1">Steer</text>

    <!-- Action Buttons -->
    <rect x="670" y="377" width="120" height="28" rx="6" fill="#b5523a" filter="url(#accent-glow)"/>
    <text x="730" y="395" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Submit Prompt</text>
  </g>

  <!-- ==================== SECTION 3: CRON TASK SCHEDULER ==================== -->
  <g filter="url(#card-shadow)">
    <!-- Container -->
    <rect x="35" y="430" width="770" height="115" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    
    <!-- Header bar -->
    <text x="50" y="450" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.8">CRON TASK SCHEDULER DASHBOARD</text>

    <!-- Add Job Button -->
    <rect x="710" y="438" width="80" height="18" rx="4" fill="#334155"/>
    <text x="750" y="451" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#f8fafc" text-anchor="middle">+ ADD JOB</text>

    <!-- Table Header Line -->
    <rect x="50" y="462" width="740" height="20" rx="4" fill="#1e293b"/>
    <text x="60" y="476" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#94a3b8">JOB NAME</text>
    <text x="210" y="476" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#94a3b8">CRON EXPR</text>
    <text x="340" y="476" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#94a3b8">ENGINE</text>
    <text x="440" y="476" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#94a3b8">LAST RUN</text>
    <text x="540" y="476" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#94a3b8">CALLS</text>
    <text x="640" y="476" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#94a3b8">ACTIONS</text>

    <!-- Row 1 -->
    <text x="60" y="498" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Nightly DB Audit</text>
    <text x="210" y="498" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#38bdf8">0 3 * * *</text>
    <rect x="340" y="487" width="45" height="15" rx="3" fill="#1e293b"/>
    <text x="362" y="498" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#cbd5e1" text-anchor="middle">shell</text>
    <text x="440" y="498" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">0.45s ago</text>
    <text x="540" y="498" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">12</text>
    
    <!-- Action buttons -->
    <rect x="640" y="487" width="55" height="16" rx="3" fill="rgba(34, 197, 94, 0.15)"/>
    <text x="667" y="498" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#4ade80" text-anchor="middle">RUN NOW</text>
    
    <rect x="702" y="487" width="45" height="16" rx="3" fill="rgba(239, 68, 68, 0.15)"/>
    <text x="724" y="498" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#f87171" text-anchor="middle">TOGGLE</text>

    <!-- Row 2 -->
    <text x="60" y="525" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Hindsight Memory Sync</text>
    <text x="210" y="525" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#38bdf8">*/15 * * * *</text>
    <rect x="340" y="514" width="45" height="15" rx="3" fill="#1e293b"/>
    <text x="362" y="525" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#cbd5e1" text-anchor="middle">python</text>
    <text x="440" y="525" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">0.12s ago</text>
    <text x="540" y="525" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">240</text>

    <rect x="640" y="514" width="55" height="16" rx="3" fill="rgba(34, 197, 94, 0.15)"/>
    <text x="667" y="525" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#4ade80" text-anchor="middle">RUN NOW</text>

    <rect x="702" y="514" width="45" height="16" rx="3" fill="rgba(239, 68, 68, 0.15)"/>
    <text x="724" y="525" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#f87171" text-anchor="middle">TOGGLE</text>
  </g>
</svg>
